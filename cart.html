<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C•E•GO 購物車 v0.9.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 18px 110px}.top{display:flex;gap:12px;align-items:center;margin:4px 0 18px}.back{width:42px;height:42px;border:1px solid #ddd6cc;background:#fff;border-radius:14px;display:grid;place-items:center;text-decoration:none;color:#171717;font-size:23px;font-weight:900}.title{font-size:25px;font-weight:900}.muted{font-size:12px;line-height:1.5;color:#777}.card{background:#fff;border:1px solid #e5dfd5;border-radius:22px;padding:16px;margin:10px 0}.merchant{margin-top:18px}.merchant:first-child{margin-top:0}.merchantHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.merchantHead h2{margin:0;font-size:20px}.total{font-size:22px;font-weight:900}.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px dashed #e7e0d6}.item:first-of-type{margin-top:10px}.name{font-weight:800}.price{font-weight:900}.remove{border:0;background:#f3f1ed;border-radius:9px;padding:6px 8px}.checkout{display:block;text-align:center;background:#171717;color:#fff;text-decoration:none;border-radius:14px;padding:13px;margin-top:10px;font-weight:900}.warn{background:#fff9e8;border-color:#f1dfaa}.empty{text-align:center;padding:38px 10px;color:#777}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(calc(100% - 28px),690px);display:grid;grid-template-columns:repeat(4,1fr);background:#171717;border-radius:20px;padding:7px}.bottom a{color:#bbb;text-decoration:none;text-align:center;padding:9px 3px;font-size:11px;border-radius:14px}.bottom .active{background:#fff;color:#171717;font-weight:850}.version{position:fixed;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 74px);font-size:10px;color:#aaa;background:#f6f3eddd;padding:4px 6px;border-radius:8px}</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html">‹</a><div><div class="muted">C•E•GO Price Radar</div><div class="title">🛒 購物車</div></div></div><div class="card warn"><b>CEGO 幫你揀好去邊間買</b><div class="muted" style="margin-top:5px">購物車會按商戶分組。最後按「去商戶購買」會離開 CEGO，到該商戶官方網店完成加入購物車／登入／付款。未有官方第三方 Cart API 前，CEGO 唔會假扮已經幫你落單。</div></div><div id="cart"></div></main><nav class="bottom"><a href="index.html#resultsSection">⌕<br>格價</a><a href="index.html#watchSection">♡<br>常買</a><a href="nearby.html">⌖<br>附近</a><a class="active" href="cart.html">🛒<br>購物車</a></nav><div class="version">v0.9.0</div><script>const KEY='cego-price-cart-v1',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cart=[];try{cart=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}function save(){localStorage.setItem(KEY,JSON.stringify(cart));render()}window.removeItem=id=>{cart=cart.filter(x=>x.id!==id);save()};function render(){const el=$('#cart');if(!cart.length){el.innerHTML='<div class="card empty">🛒<br><br>購物車未有貨品。<br><span class="muted">返去格價結果，揀商戶後加入購物車。</span></div>';return}const groups={};cart.forEach(x=>(groups[x.store]??=[]).push(x));el.innerHTML=Object.entries(groups).map(([store,items])=>{const total=items.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||1),0),url=items.find(x=>x.shopUrl)?.shopUrl||'#';return `<section class="card merchant"><div class="merchantHead"><h2>${esc(store)}</h2><div class="total">$${total.toFixed(1)}</div></div>${items.map(x=>`<div class="item"><div><div class="name">${esc([x.brand,x.product].filter(Boolean).join(' '))}</div><div class="muted">數量 ${x.qty||1}${x.exactProductLink?'｜已有指定商品連結':'｜到商戶頁再確認商品'}</div></div><div style="text-align:right"><div class="price">$${Number(x.price).toFixed(1)}</div><button class="remove" onclick="removeItem('${esc(x.id)}')">移除</button></div></div>`).join('')}<a class="checkout" href="${esc(url)}" target="_blank" rel="noopener">去 ${esc(store)} 購買 →</a></section>`}).join('')}render();</script></body></html>
