<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C•E•GO Price Radar v0.6.3</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:720px;margin:auto;padding:26px 18px 110px}.brand{font-size:13px;font-weight:900;letter-spacing:.12em}.hero{margin:18px 0 20px}.hero h1{font-size:38px;line-height:1.03;margin:0 0 9px;letter-spacing:-.04em}.sub{color:#777;font-size:14px;line-height:1.5}.searchbox{background:#fff;border:1px solid #e5dfd5;border-radius:24px;padding:10px;box-shadow:0 10px 35px #3d2e1c0b}.searchrow{display:flex;gap:8px}.searchrow input{flex:1;min-width:0;border:0;background:#f5f4f1;border-radius:16px;padding:15px 14px;font-size:17px;outline:none}.searchrow button{border:0;border-radius:16px;padding:0 18px;background:#ec5a32;color:#fff;font-size:16px;font-weight:850}.quick{display:flex;gap:8px;overflow:auto;padding:11px 1px 2px;scrollbar-width:none}.quick button{white-space:nowrap;border:1px solid #e9e3da;background:#fff;border-radius:999px;padding:9px 12px;font-size:13px}.section{margin-top:24px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}.sectionhead h2{font-size:21px;margin:0}.hint{font-size:12px;color:#8a857e}.card{background:#fff;border:1px solid #e7e1d7;border-radius:22px;padding:16px;margin:10px 0}.empty{padding:22px 8px;text-align:center;color:#777}.empty .icon{font-size:30px;margin-bottom:7px}.loading{text-align:center;padding:26px;color:#777}.product{padding:2px 0}.product+.product{border-top:1px solid #eee8df;margin-top:15px;padding-top:15px}.ptitle{font-weight:850;font-size:16px;line-height:1.35}.cat{font-size:11px;color:#999;margin-top:3px}.store{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px dashed #ebe6de;margin-top:8px}.store:first-of-type{margin-top:10px}.price{font-size:21px;font-weight:900}.best{color:#17814b;font-size:11px;font-weight:800}.promo{display:inline-block;background:#fff0e9;color:#b44426;border-radius:8px;padding:4px 6px;font-size:11px;margin-top:4px}.watchform{display:grid;grid-template-columns:1fr 90px;gap:8px}.watchform input,.watchform select{border:1px solid #e2ddd5;background:#faf9f6;border-radius:13px;padding:12px;font-size:14px}.watchform button{grid-column:1/-1;border:0;border-radius:13px;background:#171717;color:#fff;padding:12px;font-weight:800}.watchitem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #eee8df}.watchitem:first-child{border-top:0}.watchitem button{border:0;background:#f3f1ed;border-radius:10px;padding:7px 9px}.note{background:#fff9e8;border:1px solid #f1dfaa}.details{margin-top:14px;color:#777;font-size:12px}.details summary{cursor:pointer;font-weight:700}.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}.links a{color:#765e45;text-decoration:none;font-weight:750}.bottom{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(calc(100% - 28px),690px);display:grid;grid-template-columns:repeat(3,1fr);background:#171717;border-radius:20px;padding:7px;box-shadow:0 12px 35px #0003}.bottom button,.bottom a{border:0;background:transparent;color:#bbb;text-decoration:none;text-align:center;padding:9px 4px;font-size:11px;border-radius:14px}.bottom .active{background:#fff;color:#171717;font-weight:850}.version{position:fixed;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 74px);font-size:10px;color:#aaa;background:#f6f3edcc;padding:4px 6px;border-radius:8px}@media(max-width:420px){.hero h1{font-size:34px}.searchrow button{padding:0 14px}.app{padding-left:14px;padding-right:14px}}</style></head><body><main class="app"><div class="brand">C•E•GO</div><header class="hero"><h1>Price Radar</h1><div class="sub">你講想買咩，我哋幫你搵價、比較優惠，再記住幾時差唔多要補貨。</div></header><section class="searchbox"><div class="searchrow"><input id="q" placeholder="想買咩？例如：鮮奶、牙膏、Colgate"><button id="go">格價</button></div><div class="quick"><button data-q="鮮奶">🥛 鮮奶</button><button data-q="牙膏">🦷 牙膏</button><button data-q="牙刷">🪥 牙刷</button><button data-q="廁紙">🧻 廁紙</button><button data-q="咖啡">☕ 咖啡</button><button data-q="零食">🍫 零食</button></div></section><section class="section" id="resultsSection"><div class="sectionhead"><h2>格價結果</h2><span class="hint" id="resultMeta">惠康・百佳・其他已接來源</span></div><div class="card" id="results"><div class="empty"><div class="icon">🔎</div>輸入貨品，Price Radar 會自己搵。<br>唔需要逐間超市搜尋。</div></div></section><section class="section" id="watchSection"><div class="sectionhead"><h2>常買・補貨</h2><span class="hint">只喺有需要時提醒</span></div><div class="card"><div class="watchform"><input id="watchName" placeholder="例如：鮮奶"><select id="need"><option value="7">7 日內</option><option value="14">14 日內</option><option value="30">30 日內</option></select><button id="addWatch">＋ 加入常買</button></div><div id="watchList"></div></div></section><section class="section"><div class="card note"><b>價格說明</b><div class="sub" style="margin-top:5px">目前以消委會公開價格資料為主；網上價格與個別實體分店貨架價可能不同。Price Radar 會逐步加入更多零售商公開優惠。</div><details class="details"><summary>需要自行核對來源？</summary><div class="links"><a href="https://online-price-watch.consumer.org.hk/opw/" target="_blank" rel="noopener">消委會格價資訊通 ↗</a><a href="https://www.wellcome.com.hk/" target="_blank" rel="noopener">惠康 ↗</a><a href="https://www.parknshop.com/" target="_blank" rel="noopener">百佳 ↗</a></div></details></div></section></main><nav class="bottom"><button class="active" data-scroll="resultsSection">⌕<br>格價</button><button data-scroll="watchSection">♡<br>常買</button><a href="nearby.html">⌖<br>附近</a></nav><div class="version">v0.6.3</div><script>const $=s=>document.querySelector(s),STORE_KEY='cego-price-watchlist';let watch=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toFixed(1);function renderWatch(){const el=$('#watchList');el.innerHTML=watch.length?watch.map((x,i)=>`<div class="watchitem"><div><b>${esc(x.name)}</b><div class="hint">${x.days} 日內可能要補貨</div></div><button onclick="removeWatch(${i})">移除</button></div>`).join(''):'<div class="hint" style="padding-top:12px">未有常買貨品。</div>'}window.removeWatch=i=>{watch.splice(i,1);localStorage.setItem(STORE_KEY,JSON.stringify(watch));renderWatch()};$('#addWatch').onclick=()=>{const name=$('#watchName').value.trim();if(!name)return;watch=watch.filter(x=>x.name!==name);watch.unshift({name,days:Number($('#need').value)});localStorage.setItem(STORE_KEY,JSON.stringify(watch));renderWatch()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;search()});document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll).scrollIntoView({behavior:'smooth'}));$('#go').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});async function search(){const q=$('#q').value.trim();if(!q)return;$('#watchName').value=q;const el=$('#results');el.innerHTML='<div class="loading">正在幫你搵價…</div>';$('#resultMeta').textContent='搜尋中';try{const r=await fetch('/api/search?q='+encodeURIComponent(q),{cache:'no-store'});const data=await r.json();const rows=data.results||[];if(!rows.length){el.innerHTML=`<div class="empty"><div class="icon">🫥</div><b>暫時未找到「${esc(q)}」價格資料</b><br><span class="hint">唔代表香港冇貨；我哋會繼續擴充資料來源。</span></div>`;$('#resultMeta').textContent='暫未有結果';return}const groups={};rows.forEach(x=>(groups[x.code||x.product]??=[]).push(x));const cards=Object.values(groups).slice(0,20).map(g=>{g.sort((a,b)=>a.price-b.price);const p=g[0];return `<div class="product"><div class="ptitle">${esc(p.brand)} ${esc(p.product)}</div><div class="cat">${esc(p.category)}</div>${g.map((x,i)=>`<div class="store"><div><b>${esc(x.store)}</b>${i===0?'<div class="best">目前較低價</div>':''}${x.promo?`<div class="promo">${esc(x.promo)}</div>`:''}</div><div class="price">$${money(x.price)}</div></div>`).join('')}</div>`}).join('');el.innerHTML=cards;$('#resultMeta').textContent=`找到 ${data.products||Object.keys(groups).length} 款`;}catch(e){el.innerHTML='<div class="empty"><div class="icon">⚠️</div><b>價格服務暫時未能連線</b><br><span class="hint">稍後再試，唔需要自己逐間搜尋。</span></div>';$('#resultMeta').textContent='暫時離線'}}renderWatch();</script></body></html>
