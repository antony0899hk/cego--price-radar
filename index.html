<script>
const $=s=>document.querySelector(s),WATCH='cego-price-watchlist',BOOK='cego-price-bookmarks-v1',CART='cego-price-cart-v1',PROMO_PAGE=10; const DEFAULT_PROMO='飲品';
const CATS=[
 {icon:'🍚',name:'食品飲品',desc:'新鮮、糧油、飲品、零食',items:['鮮奶','乳酪','芝士','麵包','雞蛋','米','麵','食油','醬料','罐頭','急凍食品','水','汽水','果汁','茶','咖啡','零食','薯片','餅乾','朱古力']},
 {icon:'🏠',name:'家庭家居',desc:'紙品、清潔、洗衣、廚房',items:['廁紙','紙巾','廚房紙','洗衣液','洗衣粉','柔順劑','洗潔精','清潔劑','垃圾袋','保鮮紙','保鮮袋']},
 {icon:'🪥',name:'個人護理',desc:'口腔、洗護、女性護理',items:['牙膏','牙刷','漱口水','洗頭水','護髮素','沐浴露','洗手液','止汗劑','女性護理','成人護理']},
 {icon:'🧖',name:'美容護膚',desc:'面膜、護膚、潔面、防曬',items:['面膜','潔面','護膚','潤膚','防曬','卸妝','棉花']},
 {icon:'🐶',name:'寵物用品',desc:'狗糧、貓糧、貓砂及護理',items:['狗糧','狗零食','貓糧','貓零食','貓砂','寵物護理']},
 {icon:'👶',name:'嬰兒家庭',desc:'尿片、濕紙巾、嬰兒護理',items:['尿片','嬰兒濕紙巾','嬰兒沐浴','嬰兒洗護','嬰兒食品']},
 {icon:'🧳',name:'旅行生活',desc:'少量日常實用旅行用品',items:['旅行裝','紙底褲','即棄內褲','旅行襪','旅行樽','驅蚊用品','濕紙巾','消毒用品']},
 {icon:'📦',name:'家庭裝／箱裝',desc:'大包裝、補貨型商品',items:['箱裝水','箱裝飲品','家庭裝紙巾','大包裝洗衣液','大包裝寵物糧']}
];
let watch=[],bookmarks=[],cart=[],lastGroups=[],promoRows=[],promoShown=0;try{watch=JSON.parse(localStorage.getItem(WATCH)||'[]');bookmarks=JSON.parse(localStorage.getItem(BOOK)||'[]');cart=JSON.parse(localStorage.getItem(CART)||'[]')}catch{}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toFixed(1),itemKey=p=>String(p.code||p.product||'').trim();
function updateCounts(){$('#savedCount').textContent=`${bookmarks.length?'★':'☆'} 今次想買 ${bookmarks.length}`;$('#cartNav').textContent=`購物車${cart.length?' '+cart.length:''}`}
function isSaved(p){return bookmarks.some(x=>x.key===itemKey(p))}
function openPanel(id,button){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));document.querySelectorAll('.browseTop button').forEach(b=>b.classList.remove('active'));const p=document.getElementById(id);p.classList.add('open');if(button)button.classList.add('active');setTimeout(()=>p.scrollIntoView({behavior:'smooth',block:'start'}),30)}
window.toggleBookmark=key=>{const g=lastGroups.find(x=>itemKey(x[0])===key),i=bookmarks.findIndex(x=>x.key===key);if(i>=0)bookmarks.splice(i,1);else if(g?.length){const p=g[0];bookmarks.unshift({key,code:p.code||'',brand:p.brand||'',product:p.product||'',savedAt:new Date().toISOString()})}localStorage.setItem(BOOK,JSON.stringify(bookmarks));updateCounts();document.querySelectorAll('.bookmark').forEach(b=>{const on=bookmarks.some(x=>x.key===b.dataset.key);b.classList.toggle('on',on);b.textContent=on?'★':'☆'})};
window.addCart=(gi,oi,btn)=>{const x=lastGroups[gi]?.[oi];if(!x)return;const id=[x.store,x.code||x.product].join('|'),i=cart.findIndex(y=>y.id===id);if(i>=0)cart[i].qty=(cart[i].qty||1)+1;else cart.push({id,store:x.store,storeCode:x.storeCode||'',brand:x.brand||'',product:x.product||'',code:x.code||'',price:Number(x.price),promo:x.promo||'',qty:1,shopUrl:x.shopUrl||'',exactProductLink:!!x.exactProductLink,addedAt:new Date().toISOString()});localStorage.setItem(CART,JSON.stringify(cart));updateCounts();if(btn)btn.textContent='✓ 已加入'};
function renderCategories(){const grid=$('#categoryGrid');grid.innerHTML=CATS.map((c,i)=>`<button class="categoryBtn" data-cat="${i}">${c.icon} ${c.name}<small>${c.desc}</small></button>`).join('');grid.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>openCat(Number(b.dataset.cat)))}
function openCat(i){const c=CATS[i];$('#subcatTitle').textContent=`${c.icon} ${c.name}`;$('#subcatChips').innerHTML=c.items.map(x=>`<button class="chip" data-search="${esc(x)}">${esc(x)}</button>`).join('');$('#subcats').classList.add('show');$('#subcatChips').querySelectorAll('[data-search]').forEach(b=>b.onclick=()=>runQuery(b.dataset.search))}
function runQuery(q){$('#q').value=q;search();$('#resultsSection').scrollIntoView({behavior:'smooth'})}
function renderWatch(){const el=$('#watchList');el.innerHTML=watch.length?watch.map((x,i)=>`<div class="watchitem"><div><b>${esc(x.name)}</b><div class="hint">${x.days} 日內可能要補貨</div></div><button onclick="removeWatch(${i})">移除</button></div>`).join(''):'<div class="hint" style="padding-top:12px">未有常買貨品。</div>'}
window.removeWatch=i=>{watch.splice(i,1);localStorage.setItem(WATCH,JSON.stringify(watch));renderWatch()};$('#addWatch').onclick=()=>{const name=$('#watchName').value.trim();if(!name)return;watch=watch.filter(x=>x.name!==name);watch.unshift({name,days:Number($('#need').value)});localStorage.setItem(WATCH,JSON.stringify(watch));renderWatch()};
function promoInfo(x){const raw=(x.evidence||[]).join(' ').replace(/\s+/g,' ');if(x.store==='OK便利店'&&/Pizza Bite/i.test(raw))return{title:'Pizza Bite + 指定飲品',price:'$24 / 份',summary:'大份 Pizza Bite 配指定飲品；官方頁面現正展示。'};if(x.store==='7-Eleven'&&/至抵配|加\$5配/.test(raw))return{title:'1+1 至抵配',price:'+$5 / +$9 / +$10 / +$12',summary:'買指定食物，可加配指定飲品；價格及供應以個別店舖為準。'};if(x.store==='優品360'&&/買滿\$?100.*?\$?15/.test(raw))return{title:'限時優惠升級賞',price:'滿 $100 送 $15 優惠券',summary:'官方香港推廣；屬購物門檻優惠，唔當作單件商品減價。'};if(x.store==='惠康'&&/花生油超值優惠/.test(raw))return{title:'本週廣告',price:'',summary:'官方本週廣告已有更新；未抽到可核實單品價錢前，不當成商品特價。'};const money=raw.match(/(?:\+?\$\s*\d+(?:\.\d+)?(?:\s*\/\s*\w+)?)/);return{title:x.scope||'公開優惠',price:money?money[0]:'',summary:raw.slice(0,100)}}function tickerText(x){const p=promoInfo(x);return [p.title,p.price].filter(Boolean).join(' · ')}
function renderPromoTicker(){const track=$('#dealTickerTrack'),visual=$('#dealVisual');if(!track)return;if(!promoRows.length){track.innerHTML='<span class="dealTickerItem">🔥 暫時未有可顯示嘅公開優惠</span>';if(visual)visual.innerHTML='';return}const items=promoRows.slice(0,8).map(x=>`<a class="dealTickerItem" href="${esc(x.url||'#')}" ${x.url?'target="_blank" rel="noopener"':''}><b>🔥 ${esc(x.store)}</b><span>${esc(tickerText(x))}</span><span class="dealTickerDot">●</span></a>`).join('');track.innerHTML=items+items;track.style.animationDuration=Math.max(24,promoRows.slice(0,8).length*7)+'s';if(visual){const pics=promoRows.filter(x=>x.imageUrl&&!/logo|icon|sprite|pixel/i.test(x.imageUrl)).slice(0,10);visual.innerHTML=pics.map(x=>`<a class="dealVisualCard" href="${esc(x.url||'#')}" target="_blank" rel="noopener"><img src="${esc(x.imageUrl)}" alt="${esc(x.imageLabel||x.store+' 優惠')}" loading="lazy" onerror="this.closest('.dealVisualCard').remove()"><div class="dealVisualBody"><b>🔥 ${esc(x.store)}</b><span>${esc(tickerText(x))}</span></div></a>`).join('')}}
function promoCard(x){const p=promoInfo(x),img=x.imageUrl&&!/logo|icon|sprite|pixel/i.test(x.imageUrl)?x.imageUrl:'';return `<div class="product physical"><div class="physicalHead"><b>${esc(x.store)}</b><span class="badge">${x.sourceTier==='official'?'🟢 官方':'公開來源'}</span></div>${img?`<img class="promoHero" src="${esc(img)}" alt="${esc(x.imageLabel||p.title)}" loading="lazy" onerror="this.remove()">`:''}<div class="dealTitle">${esc(p.title)}</div>${p.price?`<div class="dealPrice">${esc(p.price)}</div>`:''}<div class="evidence">${esc(p.summary)}</div><div class="meta">${(x.mechanisms||[]).map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>${(x.evidence||[]).length?`<details class="rawDetails"><summary>技術來源文字</summary>${(x.evidence||[]).slice(0,1).map(t=>`<div class="evidence">${esc(t)}</div>`).join('')}</details>`:''}${x.url?`<a class="sourceLink" href="${esc(x.url)}" target="_blank" rel="noopener">查看官方來源 ↗</a>`:''}</div>`}
let promoStore='';function renderPromoPage(){const el=$('#promoResults'),stores=[...new Set(promoRows.map(x=>x.store))];if(!promoStore||!stores.includes(promoStore))promoStore=stores[0]||'';const rows=promoRows.filter(x=>x.store===promoStore),visible=rows.slice(0,promoShown);el.innerHTML=`<div class="storeTabs">${stores.map(s=>`<button class="storeTab ${s===promoStore?'active':''}" onclick="pickPromoStore('${esc(s).replace(/'/g,"\\'")}')">${esc(s)}</button>`).join('')}</div>`+visible.map(promoCard).join('')+(promoShown<rows.length?`<button class="moreBtn" onclick="showMorePromos()">顯示更多（仲有 ${rows.length-promoShown} 個）↓</button>`:`<div class="hint" style="text-align:center;margin-top:12px">${promoStore?esc(promoStore)+' · ':''}已顯示 ${rows.length} 個優惠來源</div>`)}window.pickPromoStore=s=>{promoStore=s;promoShown=PROMO_PAGE;renderPromoPage()}
window.showMorePromos=()=>{const n=promoRows.filter(x=>x.store===promoStore).length;promoShown=Math.min(promoShown+PROMO_PAGE,n);renderPromoPage()};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>runQuery(b.dataset.q));document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll).scrollIntoView({behavior:'smooth'}));
$('#todayBtn').onclick=()=>{openPanel('promoSection',$('#todayBtn'));const q=$('#q').value.trim();loadPromos(q||DEFAULT_PROMO)};
$('#newArrival').onclick=()=>{openPanel('newSection',$('#newArrival'));loadNewArrivals()};$('#categoryBtn').onclick=()=>openPanel('categorySection',$('#categoryBtn'));$('#allCat').onclick=()=>openPanel('categorySection',$('#categoryBtn'));$('#watchBtn').onclick=()=>openPanel('watchSection',$('#watchBtn'));$('#bottomWatch').onclick=()=>openPanel('watchSection',$('#watchBtn'));
document.querySelectorAll('[data-deal]').forEach(b=>b.onclick=()=>{const q=b.dataset.deal;$('#q').value=q;loadPromos(q)});
$('#savedCount').onclick=()=>location.href='cart.html';$('#go').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
async function loadPrices(q){const el=$('#results');try{const r=await fetch('/api/search?q='+encodeURIComponent(q),{cache:'no-store'}),d=await r.json(),rows=d.results||[];if(!rows.length){lastGroups=[];el.innerHTML=`<div class="empty"><b>暫時未找到「${esc(q)}」價格資料</b></div>`;return}const groups={};rows.forEach(x=>(groups[x.code||x.product]??=[]).push(x));lastGroups=Object.values(groups).slice(0,20);lastGroups.forEach(g=>g.sort((a,b)=>a.price-b.price));el.innerHTML=lastGroups.map((g,gi)=>{const p=g[0],key=itemKey(p),saved=isSaved(p);return `<div class="product"><div class="productHead"><div><div class="ptitle">${esc(p.brand)} ${esc(p.product)}</div><div class="cat">${esc(p.category)}</div></div><button class="bookmark ${saved?'on':''}" data-key="${esc(key)}" onclick="toggleBookmark(this.dataset.key)">${saved?'★':'☆'}</button></div>${g.map((x,oi)=>`<div class="store"><div class="storeTop"><div><b>${esc(x.store)}</b>${oi===0?'<div class="best">目前較低網店價</div>':''}${x.promo?`<div class="promo">${esc(x.promo)}</div>`:''}</div><div class="price">$${money(x.price)}</div></div><div class="actions"><button class="cartBtn" onclick="addCart(${gi},${oi},this)">＋ 購物車</button>${x.shopUrl?`<a href="${esc(x.shopUrl)}" target="_blank" rel="noopener">去網店 ↗</a>`:''}</div></div>`).join('')}</div>`}).join('')}catch(e){el.innerHTML='<div class="empty">⚠️ 價格資料服務暫時未能連線</div>'}}
function promoMatches(x,q){const s=[x.store,x.scope,...(x.evidence||[])].join(' ').toLowerCase(),t=String(q||'').trim().toLowerCase();return !t||s.includes(t)}
async function loadPromoCache(q){try{const r=await fetch('/data/promotions-cache.json?v=0101',{cache:'no-store'});if(!r.ok)throw new Error('cache '+r.status);const d=await r.json();let rows=(d.results||[]).filter(x=>promoMatches(x,q));if(!rows.length)rows=(d.results||[]);return{rows,updatedAt:d.updatedAt}}catch(e){return{rows:[],updatedAt:null}}}
async function loadPromos(q){const el=$('#promoResults');promoRows=[];promoShown=0;renderPromoTicker();el.innerHTML=`<div class="loading">搜尋「${esc(q)}」今日優惠…</div>`;
const cached=await loadPromoCache(q);if(cached.rows.length){promoRows=cached.rows;promoShown=Math.min(PROMO_PAGE,promoRows.length);renderPromoTicker();renderPromoPage();el.insertAdjacentHTML('afterbegin',`<div class="hint" style="padding:0 0 10px">🕘 先顯示已更新優惠資料${cached.updatedAt?' · '+esc(new Date(cached.updatedAt).toLocaleString('zh-HK')):''}</div>`)}
try{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),6500),r=await fetch('/api/promotions?q='+encodeURIComponent(q),{cache:'no-store',signal:ctrl.signal});clearTimeout(timer);if(!r.ok)throw new Error('api '+r.status);const d=await r.json(),rows=d.results||[];if(rows.length){promoRows=rows;promoShown=Math.min(PROMO_PAGE,promoRows.length);renderPromoTicker();renderPromoPage();el.insertAdjacentHTML('afterbegin','<div class="hint" style="padding:0 0 10px">🟢 即時公開優惠資料</div>')}else if(!cached.rows.length){renderPromoTicker();el.innerHTML=`<div class="empty">暫時未找到與「${esc(q)}」直接相關、仍有效嘅公開優惠</div>`}}catch(e){if(!cached.rows.length){renderPromoTicker();el.innerHTML='<div class="empty">⚠️ 今日優惠資料暫時未能取得，請稍後再試</div>'}else{el.insertAdjacentHTML('afterbegin','<div class="hint" style="padding:0 0 10px">📦 即時來源較慢，現正顯示今日快取資料</div>')}}}
async function loadNewArrivals(){const el=$('#newResults');el.innerHTML='<div class="loading">讀取最近首次發現商品…</div>';try{const r=await fetch('/api/new-arrivals',{cache:'no-store'}),d=await r.json(),rows=d.results||[];if(!rows.length){el.innerHTML='<div class="empty">暫時未有足夠歷史快照判定新上架；每日資料更新後會自動累積。</div>';return}el.innerHTML=rows.slice(0,30).map(x=>`<div class="product"><div class="productHead"><div><div class="ptitle">${esc(x.brand)} ${esc(x.product)}</div><div class="cat">${esc(x.category||'生活用品')}</div></div><span class="badge">CEGO 首次發現</span></div><div class="hint" style="margin-top:7px">${esc(x.store||'')} · 首次見到 ${esc(x.firstSeenAt||'')}</div></div>`).join('')}catch(e){el.innerHTML='<div class="empty">⚠️ 新上架資料暫時未能取得</div>'}}
async function search(){const q=$('#q').value.trim();if(!q)return;$('#watchName').value=q;$('#results').innerHTML='<div class="loading">正在格價…</div>';await Promise.all([loadPrices(q),loadPromos(q)])}
renderCategories();renderWatch();updateCounts();openPanel('promoSection',$('#todayBtn'));loadPromos(DEFAULT_PROMO);
</script></body></html>
