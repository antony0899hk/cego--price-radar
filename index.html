<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C•E•GO Price Radar v0.9.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:720px;margin:auto;padding:18px 18px 110px}.topline{display:flex;align-items:baseline;justify-content:space-between;margin:5px 1px 4px}.brand{font-size:13px;font-weight:900;letter-spacing:.15em}.title{font-size:24px;font-weight:900}.sub,.hint{color:#777;font-size:12px;line-height:1.45}.hero{margin:0 1px 14px}.searchbox,.card{background:#fff;border:1px solid #e5dfd5;border-radius:22px}.searchbox{padding:10px}.searchrow{display:flex;gap:8px}.searchrow input{flex:1;min-width:0;border:0;background:#f5f4f1;border-radius:15px;padding:14px;font-size:17px;outline:none}.searchrow button{border:0;border-radius:15px;padding:0 17px;background:#ec5a32;color:#fff;font-size:16px;font-weight:850}.quick{display:flex;gap:7px;overflow:auto;padding:10px 1px 1px}.quick button{white-space:nowrap;border:1px solid #e9e3da;background:#fff;border-radius:999px;padding:8px 11px}.section{margin-top:20px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.sectionhead h2{font-size:20px;margin:0}.savedCount{border:0;background:transparent;color:#9a7b26;font-weight:800}.card{padding:15px;margin:9px 0}.empty,.loading{padding:22px 8px;text-align:center;color:#777}.product+.product{border-top:1px solid #eee8df;margin-top:15px;padding-top:15px}.productHead,.physicalHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ptitle{font-weight:850;font-size:16px;line-height:1.35}.cat{font-size:11px;color:#999;margin-top:3px}.bookmark{flex:0 0 38px;width:38px;height:38px;border:1px solid #e8e1d5;background:#faf8f3;border-radius:50%;font-size:22px;color:#aaa}.bookmark.on{background:#fff7d9;border-color:#ead58b;color:#c69300}.store{padding:11px 0;border-top:1px dashed #ebe6de;margin-top:8px}.storeTop{display:flex;justify-content:space-between;gap:10px}.price{font-size:21px;font-weight:900}.best{color:#17814b;font-size:11px;font-weight:800}.promo{display:inline-block;background:#fff0e9;color:#b44426;border-radius:8px;padding:4px 6px;font-size:11px;margin-top:4px}.actions{display:flex;gap:7px;margin-top:8px}.actions button,.actions a{flex:1;border:1px solid #ded7cd;background:#fff;color:#171717;border-radius:11px;padding:9px;text-align:center;text-decoration:none;font-size:12px;font-weight:850}.actions .cartBtn{background:#171717;color:#fff;border-color:#171717}.physical{border-color:#f0d8c8;background:#fffdfa}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;background:#fff0e9;color:#b44426}.evidence{font-size:12px;line-height:1.5;color:#555;margin-top:7px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pill{font-size:10px;border:1px solid #e8e1d5;border-radius:999px;padding:4px 7px;color:#665f56;background:#fff}.sourceLink{display:inline-block;margin-top:9px;color:#765e45;text-decoration:none;font-size:12px;font-weight:800}.watchform{display:grid;grid-template-columns:1fr 90px;gap:8px}.watchform input,.watchform select{border:1px solid #e2ddd5;background:#faf9f6;border-radius:13px;padding:12px}.watchform button{grid-column:1/-1;border:0;border-radius:13px;background:#171717;color:#fff;padding:12px;font-weight:800}.watchitem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #eee8df}.watchitem button{border:0;background:#f3f1ed;border-radius:10px;padding:7px 9px}.note{background:#fff9e8;border-color:#f1dfaa}.bottom{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(calc(100% - 28px),690px);display:grid;grid-template-columns:repeat(4,1fr);background:#171717;border-radius:20px;padding:7px}.bottom button,.bottom a{border:0;background:transparent;color:#bbb;text-decoration:none;text-align:center;padding:9px 3px;font-size:11px;border-radius:14px}.bottom .active{background:#fff;color:#171717;font-weight:850}.version{position:fixed;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 74px);font-size:10px;color:#aaa;background:#f6f3eddd;padding:4px 6px;border-radius:8px}@media(max-width:420px){.app{padding-left:14px;padding-right:14px}.title{font-size:22px}}</style></head><body><main class="app"><div class="topline"><div class="brand">C•E•GO</div><div class="title">Price Radar</div></div><header class="hero"><div class="sub">格完價 → 加入 CEGO 購物車 → 去商戶完成購買</div></header><section class="searchbox"><div class="searchrow"><input id="q" placeholder="想買咩？例如：鮮奶、汽水、牙膏"><button id="go">格價</button></div><div class="quick"><button data-q="鮮奶">🥛 鮮奶</button><button data-q="汽水">🥤 汽水</button><button data-q="牙膏">🦷 牙膏</button><button data-q="廁紙">🧻 廁紙</button><button data-q="咖啡">☕ 咖啡</button><button data-q="零食">🍫 零食</button></div></section><section class="section" id="resultsSection"><div class="sectionhead"><h2>格價結果</h2><button class="savedCount" id="savedCount">☆ 今次想買 0</button></div><div class="card" id="results"><div class="empty">🔎<br><br>輸入貨品，Price Radar 會自己搵。</div></div></section><section class="section" id="promoSection"><div class="sectionhead"><h2>🏪 門市優惠 Radar</h2><span class="hint">官方優先・公開來源</span></div><div id="promoResults" class="card"><div class="hint">格價時同步搜尋公開門市優惠情報。</div></div></section><section class="section" id="watchSection"><div class="sectionhead"><h2>常買・補貨</h2><span class="hint">只喺有需要時提醒</span></div><div class="card"><div class="watchform"><input id="watchName" placeholder="例如：鮮奶"><select id="need"><option value="7">7 日內</option><option value="14">14 日內</option><option value="30">30 日內</option></select><button id="addWatch">＋ 加入常買</button></div><div id="watchList"></div></div></section><section class="section"><div class="card note"><b>🛒 CEGO 購物車</b><div class="sub" style="margin-top:5px">先喺格價結果揀商戶加入 CEGO 購物車；CEGO 會按商戶分組。最後跳到商戶官方網店完成登入、加入商戶購物車及付款。未有官方 Cart API 嘅商戶，CEGO 唔會假裝已經替你落單。</div></div></section></main><nav class="bottom"><button class="active" data-scroll="resultsSection">⌕<br>格價</button><button data-scroll="watchSection">♡<br>常買</button><a href="nearby.html">⌖<br>附近</a><a href="cart.html">🛒<br><span id="cartNav">購物車</span></a></nav><div class="version">v0.9.0</div><script>const $=s=>document.querySelector(s),WATCH='cego-price-watchlist',BOOK='cego-price-bookmarks-v1',CART='cego-price-cart-v1';let watch=[],bookmarks=[],cart=[],lastGroups=[];try{watch=JSON.parse(localStorage.getItem(WATCH)||'[]');bookmarks=JSON.parse(localStorage.getItem(BOOK)||'[]');cart=JSON.parse(localStorage.getItem(CART)||'[]')}catch{}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toFixed(1),itemKey=p=>String(p.code||p.product||'').trim();function updateCounts(){$('#savedCount').textContent=`${bookmarks.length?'★':'☆'} 今次想買 ${bookmarks.length}`;$('#cartNav').textContent=`購物車${cart.length?' '+cart.length:''}`}function isSaved(p){return bookmarks.some(x=>x.key===itemKey(p))}window.toggleBookmark=key=>{const g=lastGroups.find(x=>itemKey(x[0])===key),i=bookmarks.findIndex(x=>x.key===key);if(i>=0)bookmarks.splice(i,1);else if(g?.length){const p=g[0];bookmarks.unshift({key,code:p.code||'',brand:p.brand||'',product:p.product||'',savedAt:new Date().toISOString()})}localStorage.setItem(BOOK,JSON.stringify(bookmarks));updateCounts();document.querySelectorAll('.bookmark').forEach(b=>{const on=bookmarks.some(x=>x.key===b.dataset.key);b.classList.toggle('on',on);b.textContent=on?'★':'☆'})};window.addCart=(gi,oi)=>{const x=lastGroups[gi]?.[oi];if(!x)return;const id=[x.store,x.code||x.product].join('|'),i=cart.findIndex(y=>y.id===id);if(i>=0)cart[i].qty=(cart[i].qty||1)+1;else cart.push({id,store:x.store,storeCode:x.storeCode||'',brand:x.brand||'',product:x.product||'',code:x.code||'',price:Number(x.price),promo:x.promo||'',qty:1,shopUrl:x.shopUrl||'',exactProductLink:!!x.exactProductLink,addedAt:new Date().toISOString()});localStorage.setItem(CART,JSON.stringify(cart));updateCounts();event?.target&&(event.target.textContent='✓ 已加入');};function renderWatch(){const el=$('#watchList');el.innerHTML=watch.length?watch.map((x,i)=>`<div class="watchitem"><div><b>${esc(x.name)}</b><div class="hint">${x.days} 日內可能要補貨</div></div><button onclick="removeWatch(${i})">移除</button></div>`).join(''):'<div class="hint" style="padding-top:12px">未有常買貨品。</div>'}window.removeWatch=i=>{watch.splice(i,1);localStorage.setItem(WATCH,JSON.stringify(watch));renderWatch()};$('#addWatch').onclick=()=>{const name=$('#watchName').value.trim();if(!name)return;watch=watch.filter(x=>x.name!==name);watch.unshift({name,days:Number($('#need').value)});localStorage.setItem(WATCH,JSON.stringify(watch));renderWatch()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;search()});document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll).scrollIntoView({behavior:'smooth'}));$('#savedCount').onclick=()=>location.href='cart.html';$('#go').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});async function loadPrices(q){const el=$('#results');try{const r=await fetch('/api/search?q='+encodeURIComponent(q),{cache:'no-store'}),d=await r.json(),rows=d.results||[];if(!rows.length){lastGroups=[];el.innerHTML=`<div class="empty"><b>暫時未找到「${esc(q)}」網店價格</b></div>`;return}const groups={};rows.forEach(x=>(groups[x.code||x.product]??=[]).push(x));lastGroups=Object.values(groups).slice(0,20);lastGroups.forEach(g=>g.sort((a,b)=>a.price-b.price));el.innerHTML=lastGroups.map((g,gi)=>{const p=g[0],key=itemKey(p),saved=isSaved(p);return `<div class="product"><div class="productHead"><div><div class="ptitle">${esc(p.brand)} ${esc(p.product)}</div><div class="cat">${esc(p.category)}</div></div><button class="bookmark ${saved?'on':''}" data-key="${esc(key)}" onclick="toggleBookmark(this.dataset.key)">${saved?'★':'☆'}</button></div>${g.map((x,oi)=>`<div class="store"><div class="storeTop"><div><b>${esc(x.store)}</b>${oi===0?'<div class="best">目前較低網店價</div>':''}${x.promo?`<div class="promo">${esc(x.promo)}</div>`:''}</div><div class="price">$${money(x.price)}</div></div><div class="actions"><button class="cartBtn" onclick="addCart(${gi},${oi})">＋ 購物車</button>${x.shopUrl?`<a href="${esc(x.shopUrl)}" target="_blank" rel="noopener">去網店 ↗</a>`:''}</div></div>`).join('')}</div>`}).join('')}catch(e){el.innerHTML='<div class="empty">⚠️ 網店價格服務暫時未能連線</div>'}}async function loadPromos(q){const el=$('#promoResults');el.innerHTML='<div class="loading">搜尋門市優惠…</div>';try{const r=await fetch('/api/promotions?q='+encodeURIComponent(q),{cache:'no-store'}),d=await r.json(),rows=d.results||[];if(!rows.length){el.innerHTML=`<div class="empty">暫時未找到與「${esc(q)}」直接相關嘅門市優惠情報</div>`;return}el.innerHTML=rows.map(x=>`<div class="product physical"><div class="physicalHead"><b>${esc(x.store)}</b><span class="badge">${x.sourceTier==='official'?'🟢 官方':'公開來源'}</span></div><div class="hint">${esc(x.scope||'')}</div>${(x.evidence||[]).slice(0,2).map(t=>`<div class="evidence">${esc(t)}</div>`).join('')}<div class="meta">${(x.mechanisms||[]).map(m=>`<span class="pill">${esc(m)}</span>`).join('')}</div>${x.url?`<a class="sourceLink" href="${esc(x.url)}" target="_blank" rel="noopener">查看來源 ↗</a>`:''}</div>`).join('')}catch(e){el.innerHTML='<div class="empty">⚠️ 門市優惠來源暫時未能連線</div>'}}async function search(){const q=$('#q').value.trim();if(!q)return;$('#watchName').value=q;$('#results').innerHTML='<div class="loading">正在格價…</div>';await Promise.all([loadPrices(q),loadPromos(q)])}renderWatch();updateCounts();</script></body></html>
