<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C•E•GO Price Radar V2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:920px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e8e2d9;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 28px rgba(0,0,0,.05)}h1{margin-bottom:4px}.muted{color:#777;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}input{flex:1;min-width:180px}button{background:#171717;color:#fff;font-weight:800;cursor:pointer}.deal{border:1px solid #eee;border-radius:16px;padding:14px;margin-top:10px}.price{font-size:24px;font-weight:900}.old{text-decoration:line-through;color:#999;font-size:13px}.tag{display:inline-block;background:#fff3d8;border-radius:999px;padding:5px 8px;font-size:12px;margin:5px 6px 0 0}.best{background:#dcf8e8}.watch{background:#e65a2f;border:0}.watch-item{border-top:1px dashed #ddd;padding:12px 0}.watch-item:first-child{border-top:0}.danger{background:#fff0ee;color:#a43b2a}.alert{background:#171717;color:#fff;border-radius:14px;padding:12px;margin-top:10px}@media(max-width:640px){.row>*{width:100%}}</style></head><body><div class="wrap"><h1>C•E•GO Price Radar</h1><div class="muted">V2｜搜尋價格＋補貨清單＋目標價＋同品牌 promotion 提示</div><div class="card"><div class="row"><input id="q" value="牙膏" placeholder="例如：牙膏、洗頭水、咖啡"><button id="search">搵價錢</button></div></div><div class="card"><h2>今日價格</h2><div id="results"></div></div><div class="card"><h2>加入補貨清單</h2><div class="row"><input id="watchName" value="牙膏" placeholder="貨品"><input id="brand" placeholder="慣用品牌（可留空）"><input id="target" type="number" step="0.1" placeholder="目標價 HK$"><select id="need"><option value="7">約 1 星期內要買</option><option value="14">約 2 星期內要買</option><option value="30">約 1 個月內要買</option></select><button class="watch" id="watch">＋ 加入</button></div><div id="watchList" style="margin-top:10px"></div></div><div class="card"><h2>今日提醒</h2><div id="alerts" class="muted">未有符合條件嘅提示。</div></div><div class="muted">價格 feed 目前仍是 starter data；watchlist／目標價／同品牌提示邏輯已經正式落地，之後只要逐個接真實零售價格 provider。</div></div><script>
let db={},watchlist=JSON.parse(localStorage.getItem('cego-price-watchlist')||'[]');
fetch('data/products.json').then(r=>r.json()).then(x=>{db=x;renderPrices();renderWatch();renderAlerts()}).catch(()=>{});
const money=n=>Number(n).toFixed(1);
function currentQuery(){return document.querySelector('#q').value.trim()||'牙膏'}
function renderPrices(){const q=currentQuery(),list=(db[q]||[]).slice().sort((a,b)=>a.price-b.price);document.querySelector('#watchName').value=q;document.querySelector('#results').innerHTML=list.length?list.map((x,i)=>`<div class="deal"><b>${x.store}｜${x.product}</b><div class="price">HK$${money(x.price)}</div>${x.regularPrice>x.price?`<div class="old">原價 HK$${money(x.regularPrice)}</div>`:''}<span class="tag">${x.promo}</span>${i===0?'<span class="tag best">目前較抵</span>':''}</div>`).join(''):'<div class="muted">暫時未有呢件貨嘅 feed。</div>'}
function save(){localStorage.setItem('cego-price-watchlist',JSON.stringify(watchlist))}
function addWatch(){const name=document.querySelector('#watchName').value.trim(),brand=document.querySelector('#brand').value.trim(),target=Number(document.querySelector('#target').value)||null,needDays=Number(document.querySelector('#need').value);if(!name)return;watchlist=watchlist.filter(x=>!(x.name===name&&x.brand===brand));watchlist.unshift({name,brand,target,needDays,createdAt:new Date().toISOString()});save();renderWatch();renderAlerts()}
function removeWatch(i){watchlist.splice(i,1);save();renderWatch();renderAlerts()}
function renderWatch(){document.querySelector('#watchList').innerHTML=watchlist.length?watchlist.map((x,i)=>`<div class="watch-item"><b>${x.name}${x.brand?'｜'+x.brand:''}</b><div class="muted">${x.target?'目標價 HK$'+money(x.target)+'｜':''}${x.needDays} 日內可能要買</div><button class="danger" style="margin-top:7px;padding:7px 10px" onclick="removeWatch(${i})">移除</button></div>`).join(''):'<div class="muted">未有補貨項目。</div>'}
function renderAlerts(){const alerts=[];for(const w of watchlist){const list=db[w.name]||[];const sameBrand=w.brand?list.filter(x=>x.brand.toLowerCase().includes(w.brand.toLowerCase())):list;const pool=sameBrand.length?sameBrand:list;if(!pool.length)continue;const best=pool.slice().sort((a,b)=>a.price-b.price)[0];const saving=best.regularPrice>best.price;const hitTarget=w.target&&best.price<=w.target;if(hitTarget||saving){alerts.push(`<div class="alert"><b>${w.name}${w.brand?'｜'+w.brand:''}</b><br>${best.store} HK$${money(best.price)}｜${best.promo}${hitTarget?'｜✅ 已到目標價':''}${saving?'｜📉 比原價平':''}</div>`)}}document.querySelector('#alerts').innerHTML=alerts.length?alerts.join(''):'<div class="muted">未有符合條件嘅提示。</div>'}
document.querySelector('#search').onclick=renderPrices;document.querySelector('#watch').onclick=addWatch;window.removeWatch=removeWatch;renderWatch();
</script></body></html>
