<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C•E•GO Price Radar V0.3</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e8e2d9;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 8px 28px #0000000d}h1{margin:5px 0}.muted{color:#777;font-size:14px}.row,.chips{display:flex;gap:8px;flex-wrap:wrap}input,button,select{padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}input{flex:1;min-width:180px}button{background:#171717;color:#fff;font-weight:800;cursor:pointer}.chip{background:#f2eee7;color:#222;border:0;padding:9px 12px}.red{background:#fff0ee;border-color:#ffc9bf}.red h2{color:#b33622}.deal{border:1px solid #eee;border-radius:16px;padding:14px;margin-top:10px}.live{background:#f8fbff}.price{font-size:23px;font-weight:900}.tag{display:inline-block;background:#fff3d8;border-radius:999px;padding:5px 8px;font-size:12px;margin:5px 5px 0 0}.best{background:#dcf8e8}.promo{background:#ffe1db}.watch{background:#e65a2f;border:0}.watch-item{border-top:1px dashed #ddd;padding:12px 0}.alert{background:#171717;color:#fff;border-radius:14px;padding:12px;margin-top:10px}.source{font-size:12px;color:#666;margin-top:10px}.source a{color:#2457a7;text-decoration:none;font-weight:700}.product-title{font-weight:850}.storeline{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed #e6e6e6}.storeline:first-of-type{border-top:0}.loading{padding:20px;text-align:center}.count{font-weight:800;margin-bottom:8px}@media(max-width:640px){.row>input,.row>select,.row>.watch{width:100%}.storeline{align-items:flex-start}}</style></head><body><div class="wrap"><h1>C•E•GO Price Radar</h1><div class="muted">V0.3｜真實每日格價資料＋Promotion＋補貨 Radar</div>
<div class="card red"><h2>🔴 今日優惠 Radar</h2><div class="muted">撳一類即刻掃官方每日格價資料，先畀你有嘢玩。</div><div class="chips" style="margin-top:10px"><button class="chip" data-q="牙膏">🪥 牙膏</button><button class="chip" data-q="廁紙">🧻 廁紙</button><button class="chip" data-q="米">🍚 米</button><button class="chip" data-q="牛奶">🥛 牛奶</button><button class="chip" data-q="洗頭水">🧴 洗頭水</button><button class="chip" data-q="咖啡">☕ 咖啡</button></div></div>
<div class="card"><div class="row"><input id="q" value="牙膏" placeholder="貨品、品牌或條碼，例如：牙膏、Colgate、UCC"><button id="search">搵真價</button></div></div>
<div class="card"><h2>即時格價</h2><div id="liveResults" class="muted">準備搜尋…</div></div>
<div class="card"><h2>❤️ 常買／補貨</h2><div class="row"><input id="watchName" value="牙膏" placeholder="貨品"><input id="brand" placeholder="慣用品牌（可留空）"><input id="target" type="number" step="0.1" placeholder="目標價 HK$"><select id="need"><option value="7">1 星期內要買</option><option value="14">2 星期內要買</option><option value="30">1 個月內要買</option></select><button class="watch" id="watch">＋ 加入</button></div><div id="watchList"></div></div>
<div class="card"><h2>🔔 我的提醒</h2><div id="alerts" class="muted">加入常買貨品後，之後可以將 live promotion 同補貨期接埋。</div></div>
<div class="muted">資料來源：香港消費者委員會「格價資訊通」每日 Open Data。網店價可能與實體門市不同；門市廣告 Radar 會作第二條 feed 加入。</div></div><script>
let watchlist=JSON.parse(localStorage.getItem('cego-price-watchlist')||'[]'),last=[];const $=s=>document.querySelector(s),money=n=>Number(n).toFixed(1);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function searchLive(){const q=$('#q').value.trim()||'牙膏',el=$('#liveResults');$('#watchName').value=q;el.innerHTML='<div class="loading">🔎 掃描官方每日資料中…</div>';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const x=await r.json();last=x.results||[];if(!last.length){el.innerHTML=`<div class="muted">今次未搵到「${esc(q)}」。可以試品牌名、較短關鍵字或條碼。</div><div class="source"><a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">開官方搜尋核對 ↗</a></div>`;return}const groups={};for(const a of last){const k=a.code||a.product;(groups[k]??=[]).push(a)}const cards=Object.values(groups).slice(0,20).map(g=>{g.sort((a,b)=>a.price-b.price);const a=g[0];return `<div class="deal live"><div class="product-title">${esc(a.brand)} ${esc(a.product)}</div><div class="muted">${esc(a.category)}</div>${g.map((x,i)=>`<div class="storeline"><div><b>${esc(x.store)}</b>${x.promo?`<br><span class="tag promo">🏷️ ${esc(x.promo)}</span>`:''}${i===0?'<span class="tag best">較低價</span>':''}</div><div class="price">$${money(x.price)}</div></div>`).join('')}</div>`}).join('');el.innerHTML=`<div class="count">找到 ${x.products||Object.keys(groups).length} 款相關貨品｜顯示頭 ${Math.min(20,Object.keys(groups).length)} 款</div>${cards}<div class="source">${esc(x.note||'')}<br><a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">開消委會官方搜尋 ↗</a></div>`;renderAlerts()}catch(e){el.innerHTML='<div class="muted">即時資料暫時連線失敗，等部署完成後再試。</div>'}}
function save(){localStorage.setItem('cego-price-watchlist',JSON.stringify(watchlist))}function addWatch(){const name=$('#watchName').value.trim(),brand=$('#brand').value.trim(),target=Number($('#target').value)||null,needDays=Number($('#need').value);if(!name)return;watchlist=watchlist.filter(x=>!(x.name===name&&x.brand===brand));watchlist.unshift({name,brand,target,needDays,createdAt:new Date().toISOString()});save();renderWatch();renderAlerts()}function removeWatch(i){watchlist.splice(i,1);save();renderWatch();renderAlerts()}function renderWatch(){$('#watchList').innerHTML=watchlist.length?watchlist.map((x,i)=>`<div class="watch-item"><b>${esc(x.name)}${x.brand?'｜'+esc(x.brand):''}</b><div class="muted">${x.target?'目標 $'+money(x.target)+'｜':''}${x.needDays} 日內要買</div><button class="chip" onclick="removeWatch(${i})">移除</button></div>`).join(''):'<div class="muted" style="margin-top:10px">未有補貨項目。</div>'}function renderAlerts(){const alerts=[];for(const w of watchlist){let pool=last.filter(x=>[x.product,x.brand,x.category].join(' ').toLowerCase().includes(w.name.toLowerCase()));if(w.brand){const b=pool.filter(x=>x.brand.toLowerCase().includes(w.brand.toLowerCase()));if(b.length)pool=b}if(!pool.length)continue;pool.sort((a,b)=>a.price-b.price);const best=pool[0],hit=w.target&&best.price<=w.target,promo=pool.find(x=>x.promo);if(hit||promo)alerts.push(`<div class="alert"><b>${esc(w.name)}${w.brand?'｜'+esc(w.brand):''}</b><br>${esc(best.store)} $${money(best.price)}${hit?'｜✅ 到目標價':''}${promo?'｜🏷️ '+esc(promo.promo):''}</div>`)}$('#alerts').innerHTML=alerts.length?alerts.join(''):'<div class="muted">暫時未有符合你清單嘅 live 提示。</div>'}
$('#search').onclick=searchLive;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')searchLive()});$('#watch').onclick=addWatch;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;searchLive()});window.removeWatch=removeWatch;renderWatch();searchLive();
</script></body></html>
