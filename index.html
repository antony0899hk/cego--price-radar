<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C•E•GO Price Radar V1</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e8e2d9;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 28px rgba(0,0,0,.05)}h1{margin-bottom:4px}.muted{color:#777;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{padding:12px;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}input{flex:1;min-width:220px}button{background:#171717;color:#fff;font-weight:800;cursor:pointer}.deal{border:1px solid #eee;border-radius:16px;padding:14px;margin-top:10px}.price{font-size:24px;font-weight:900}.tag{display:inline-block;background:#fff3d8;border-radius:999px;padding:5px 8px;font-size:12px;margin-right:6px}.watch{margin-top:10px;background:#e65a2f;border:0}@media(max-width:640px){.row>*{width:100%}}</style></head><body><div class="wrap"><h1>C•E•GO Price Radar</h1><div class="muted">V1｜先做「我要買咩 → 幫我睇邊度平／有冇 promotion」</div><div class="card"><div class="row"><input id="q" value="牙膏" placeholder="例如：牙膏、洗頭水、咖啡"><select id="area"><option>全部</option><option>超市</option><option>藥房</option></select><button id="search">搵價錢</button></div></div><div class="card"><h2>今日價格</h2><div id="results"></div></div><div class="card"><h2>補貨提醒概念</h2><div class="muted">將常買貨品加入清單；當同款或同品牌出現 promotion，就提示你。V1 先保留功能位，之後再接真實價格來源。</div><button class="watch" id="watch">＋ 加入「牙膏」補貨清單</button><div id="msg" class="muted" style="margin-top:10px"></div></div></div><script>const demo={牙膏:[['Store A','$29.9','同款減價'],['Store B','$34.0','第二件優惠'],['Store C','$31.5','同品牌優惠']],洗頭水:[['Store A','$48.0','會員價'],['Store B','$52.9','暫無優惠']],咖啡:[['Store A','$69.9','本週特價'],['Store C','$72.0','買二減十']]};function render(){const q=document.querySelector('#q').value.trim()||'牙膏';const list=demo[q]||[['暫無示範資料','—','之後接正式價格資料源']];document.querySelector('#results').innerHTML=list.map((x,i)=>`<div class="deal"><b>${x[0]}</b><div class="price">${x[1]}</div><span class="tag">${x[2]}</span>${i===0?'<span class="tag">目前較抵</span>':''}</div>`).join('');document.querySelector('#watch').textContent=`＋ 加入「${q}」補貨清單`}document.querySelector('#search').onclick=render;document.querySelector('#watch').onclick=()=>document.querySelector('#msg').textContent='已用示範方式加入提醒；正式版會保存用品與 promotion 條件。';render();</script></body></html>
