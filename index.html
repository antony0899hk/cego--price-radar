<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C•E•GO Price Radar v0.7.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ed;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:720px;margin:auto;padding:18px 18px 110px}.topline{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:5px 1px 4px}.brand{font-size:13px;font-weight:900;letter-spacing:.15em;white-space:nowrap}.title{font-size:24px;line-height:1;font-weight:900;letter-spacing:-.035em;white-space:nowrap}.sub{color:#777;font-size:12px;line-height:1.45}.hero{margin:0 1px 14px}.searchbox,.card{background:#fff;border:1px solid #e5dfd5;border-radius:22px}.searchbox{padding:10px;box-shadow:0 10px 35px #3d2e1c0b}.searchrow{display:flex;gap:8px}.searchrow input{flex:1;min-width:0;border:0;background:#f5f4f1;border-radius:15px;padding:14px;font-size:17px;outline:none}.searchrow button{border:0;border-radius:15px;padding:0 17px;background:#ec5a32;color:#fff;font-size:16px;font-weight:850}.quick{display:flex;gap:7px;overflow:auto;padding:10px 1px 1px;scrollbar-width:none}.quick button{white-space:nowrap;border:1px solid #e9e3da;background:#fff;border-radius:999px;padding:8px 11px;font-size:13px}.section{margin-top:20px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.sectionhead h2{font-size:20px;margin:0}.hint{font-size:12px;color:#8a857e}.savedCount{border:0;background:transparent;color:#9a7b26;font-size:12px;font-weight:800}.card{padding:15px;margin:9px 0}.empty,.loading{padding:22px 8px;text-align:center;color:#777}.empty .icon{font-size:30px;margin-bottom:7px}.product+.product{border-top:1px solid #eee8df;margin-top:15px;padding-top:15px}.productHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.ptitle{font-weight:850;font-size:16px;line-height:1.35}.cat{font-size:11px;color:#999;margin-top:3px}.bookmark{flex:0 0 38px;width:38px;height:38px;border:1px solid #e8e1d5;background:#faf8f3;border-radius:50%;font-size:22px;color:#aaa}.bookmark.on{background:#fff7d9;border-color:#ead58b;color:#c69300}.store{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px dashed #ebe6de;margin-top:8px}.price{font-size:21px;font-weight:900}.best{color:#17814b;font-size:11px;font-weight:800}.promo{display:inline-block;background:#fff0e9;color:#b44426;border-radius:8px;padding:4px 6px;font-size:11px;margin-top:4px}.physical{border-color:#f0d8c8;background:#fffdfa}.physicalHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;background:#fff0e9;color:#b44426}.evidence{font-size:12px;line-height:1.5;color:#555;margin-top:7px}.sourceLink{display:inline-block;margin-top:9px;color:#765e45;text-decoration:none;font-size:12px;font-weight:800}.watchform{display:grid;grid-template-columns:1fr 90px;gap:8px}.watchform input,.watchform select{border:1px solid #e2ddd5;background:#faf9f6;border-radius:13px;padding:12px;font-size:14px}.watchform button{grid-column:1/-1;border:0;border-radius:13px;background:#171717;color:#fff;padding:12px;font-weight:800}.watchitem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #eee8df}.watchitem button{border:0;background:#f3f1ed;border-radius:10px;padding:7px 9px}.note{background:#fff9e8;border-color:#f1dfaa}.details{margin-top:10px;color:#777;font-size:12px}.bottom{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(calc(100% - 28px),690px);display:grid;grid-template-columns:repeat(3,1fr);background:#171717;border-radius:20px;padding:7px;box-shadow:0 12px 35px #0003}.bottom button,.bottom a{border:0;background:transparent;color:#bbb;text-decoration:none;text-align:center;padding:9px 4px;font-size:11px;border-radius:14px}.bottom .active{background:#fff;color:#171717;font-weight:850}.version{position:fixed;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 74px);font-size:10px;color:#aaa;background:#f6f3eddd;padding:4px 6px;border-radius:8px}@media(max-width:420px){.app{padding-left:14px;padding-right:14px}.title{font-size:22px}.sub{font-size:11.5px}}</style></head><body><main class="app"><div class="topline"><div class="brand">C•E•GO</div><div class="title">Price Radar</div></div><header class="hero"><div class="sub">網店格價・實體店公開優惠・附近分店</div></header><section class="searchbox"><div class="searchrow"><input id="q" placeholder="想買咩？例如：鮮奶、牙膏、Colgate"><button id="go">格價</button></div><div class="quick"><button data-q="鮮奶">🥛 鮮奶</button><button data-q="牙膏">🦷 牙膏</button><button data-q="牙刷">🪥 牙刷</button><button data-q="廁紙">🧻 廁紙</button><button data-q="咖啡">☕ 咖啡</button><button data-q="零食">🍫 零食</button></div></section><section class="section" id="resultsSection"><div class="sectionhead"><h2>格價結果</h2><button class="savedCount" id="savedCount">☆ 今次想買 0</button></div><div class="card" id="results"><div class="empty"><div class="icon">🔎</div>輸入貨品，Price Radar 會自己搵。</div></div></section><section class="section" id="promoSection"><div class="sectionhead"><h2>🏪 實體店公開優惠</h2><span class="hint">官方推廣證據</span></div><div id="promoResults" class="card"><div class="hint">格價時會同步搜尋便利店／零食店官方優惠。</div></div></section><section class="section" id="watchSection"><div class="sectionhead"><h2>常買・補貨</h2><span class="hint">只喺有需要時提醒</span></div><div class="card"><div class="watchform"><input id="watchName" placeholder="例如：鮮奶"><select id="need"><option value="7">7 日內</option><option value="14">14 日內</option><option value="30">30 日內</option></select><button id="addWatch">＋ 加入常買</button></div><div id="watchList"></div></div></section><section class="section"><div class="card note"><b>價格說明</b><div class="sub" style="margin-top:5px">「格價結果」主要係網店／App 公開價；「實體店公開優惠」來自官方推廣頁。未有指定分店證據時，唔會當成附近分店即時貨架價或庫存。</div><details class="details"><summary>資料來源規則</summary><p>消委會公開格價資料負責逐件價格；優品360、7-Eleven、OK 等官方頁負責公開推廣證據。之後再逐步加入更多實體店來源。</p></details></div></section></main><nav class="bottom"><button class="active" data-scroll="resultsSection">⌕<br>格價</button><button data-scroll="watchSection">♡<br>常買</button><a href="nearby.html">⌖<br>附近</a></nav><div class="version">v0.7.0</div><script>const $=s=>document.querySelector(s),STORE_KEY='cego-price-watchlist',BOOKMARK_KEY='cego-price-bookmarks-v1';let watch=JSON.parse(localStorage.getItem(STORE_KEY)||'[]'),bookmarks=JSON.parse(localStorage.getItem(BOOKMARK_KEY)||'[]'),lastGroups=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n).toFixed(1),itemKey=p=>String(p.code||p.product||'').trim();function isSaved(p){return bookmarks.some(x=>x.key===itemKey(p))}function updateSavedCount(){$('#savedCount').textContent=`${bookmarks.length?'★':'☆'} 今次想買 ${bookmarks.length}`}function toggleBookmark(key){const group=lastGroups.find(g=>itemKey(g[0])===key),i=bookmarks.findIndex(x=>x.key===key);if(i>=0)bookmarks.splice(i,1);else if(group?.length){const p=group[0];bookmarks.unshift({key,code:p.code||'',brand:p.brand||'',product:p.product||'',savedAt:new Date().toISOString()})}localStorage.setItem(BOOKMARK_KEY,JSON.stringify(bookmarks));updateSavedCount();document.querySelectorAll('.bookmark').forEach(b=>{const on=bookmarks.some(x=>x.key===b.dataset.key);b.classList.toggle('on',on);b.textContent=on?'★':'☆'})}window.toggleBookmark=toggleBookmark;function renderWatch(){const el=$('#watchList');el.innerHTML=watch.length?watch.map((x,i)=>`<div class="watchitem"><div><b>${esc(x.name)}</b><div class="hint">${x.days} 日內可能要補貨</div></div><button onclick="removeWatch(${i})">移除</button></div>`).join(''):'<div class="hint" style="padding-top:12px">未有常買貨品。</div>'}window.removeWatch=i=>{watch.splice(i,1);localStorage.setItem(STORE_KEY,JSON.stringify(watch));renderWatch()};$('#addWatch').onclick=()=>{const name=$('#watchName').value.trim();if(!name)return;watch=watch.filter(x=>x.name!==name);watch.unshift({name,days:Number($('#need').value)});localStorage.setItem(STORE_KEY,JSON.stringify(watch));renderWatch()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;search()});document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.scroll).scrollIntoView({behavior:'smooth'}));$('#savedCount').onclick=()=>{if(bookmarks.length)alert('今次想買：\n'+bookmarks.map(x=>'★ '+[x.brand,x.product].filter(Boolean).join(' ')).join('\n'))};$('#go').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});async function loadPrices(q){const el=$('#results');try{const r=await fetch('/api/search?q='+encodeURIComponent(q),{cache:'no-store'}),data=await r.json(),rows=data.results||[];if(!rows.length){lastGroups=[];el.innerHTML=`<div class="empty"><b>暫時未找到「${esc(q)}」網店價格</b><br><span class="hint">會繼續搜尋實體店公開優惠。</span></div>`;return}const groups={};rows.forEach(x=>(groups[x.code||x.product]??=[]).push(x));lastGroups=Object.values(groups).slice(0,20);el.innerHTML=lastGroups.map(g=>{g.sort((a,b)=>a.price-b.price);const p=g[0],key=itemKey(p),saved=isSaved(p);return `<div class="product"><div class="productHead"><div><div class="ptitle">${esc(p.brand)} ${esc(p.product)}</div><div class="cat">${esc(p.category)}</div></div><button class="bookmark ${saved?'on':''}" data-key="${esc(key)}" onclick="toggleBookmark(this.dataset.key)">${saved?'★':'☆'}</button></div>${g.map((x,i)=>`<div class="store"><div><b>${esc(x.store)}</b>${i===0?'<div class="best">目前較低網店價</div>':''}${x.promo?`<div class="promo">${esc(x.promo)}</div>`:''}</div><div class="price">$${money(x.price)}</div></div>`).join('')}</div>`}).join('')}catch(e){el.innerHTML='<div class="empty">⚠️ 網店價格服務暫時未能連線</div>'}}async function loadPromos(q){const el=$('#promoResults');el.innerHTML='<div class="loading">同步搜尋官方實體店優惠…</div>';try{const r=await fetch('/api/promotions?q='+encodeURIComponent(q),{cache:'no-store'}),data=await r.json(),rows=data.results||[];if(!rows.length){el.innerHTML=`<div class="empty"><b>暫時未找到與「${esc(q)}」直接相關嘅官方實體優惠</b><br><span class="hint">唔會用估價或未核實貨架價補位。</span></div>`;return}el.innerHTML=rows.map(x=>`<div class="product physical"><div class="physicalHead"><b>${esc(x.store)}</b><span class="badge">${esc(x.scope)}</span></div>${(x.evidence||[]).slice(0,2).map(t=>`<div class="evidence">${esc(t)}</div>`).join('')}<div class="hint" style="margin-top:7px">未確認指定分店貨架價／庫存</div><a class="sourceLink" href="${esc(x.url)}" target="_blank" rel="noopener">核對官方優惠 ↗</a></div>`).join('')}catch(e){el.innerHTML='<div class="empty">⚠️ 官方優惠來源暫時未能連線</div>'}}async function search(){const q=$('#q').value.trim();if(!q)return;$('#watchName').value=q;$('#results').innerHTML='<div class="loading">正在幫你搵網店價…</div>';await Promise.all([loadPrices(q),loadPromos(q)])}renderWatch();updateSavedCount();</script></body></html>
