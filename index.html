<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C•E•GO Price Radar</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#171717;--muted:#77746f;--line:#e7e2d9;--orange:#ef5a2f;--green:#173f34;--soft:#f0ede7;--red:#b83b27}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 16px 105px}.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:10px 2px 22px}.brand h1{font-size:32px;letter-spacing:-1px;margin:0}.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}.beta{font-size:10px;letter-spacing:.08em;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px;white-space:nowrap}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 8px 30px #00000008}.searchrow{display:flex;gap:9px}.searchrow input{min-width:0;flex:1;border:1px solid #d8d5cf;border-radius:15px;padding:14px 15px;font-size:17px;background:#fbfbfa}.searchrow button{border:0;border-radius:15px;padding:0 19px;background:var(--orange);color:#fff;font-size:16px;font-weight:850}.quicktitle{font-size:12px;color:var(--muted);margin:14px 2px 8px}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{border:0;border-radius:999px;background:var(--soft);color:#292724;padding:9px 12px;font-size:13px;font-weight:700;white-space:nowrap}.section{margin-top:24px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 2px 10px}.sectionhead h2{font-size:21px;margin:0}.sectionhead span{font-size:12px;color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.empty{text-align:center;padding:28px 14px;color:var(--muted);line-height:1.6}.empty b{display:block;color:#393632;font-size:17px;margin-bottom:5px}.loading{text-align:center;padding:28px;color:var(--muted)}.deal{border-top:1px solid #eeeae3;padding:15px 0}.deal:first-child{border-top:0;padding-top:0}.product{font-size:15px;font-weight:850;line-height:1.35}.category{font-size:11px;color:var(--muted);margin:4px 0 9px}.store{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}.storename{font-weight:750}.price{font-size:20px;font-weight:900}.tag{display:inline-block;border-radius:999px;padding:4px 7px;font-size:10px;margin:3px 4px 0 0;background:#f4f1eb}.best{background:#dff5e8;color:#185d3d}.promo{background:#fff0e8;color:#a54425}.resultmeta{font-size:12px;color:var(--muted);margin-bottom:12px}.watchform{display:grid;grid-template-columns:1fr 1fr;gap:9px}.watchform input,.watchform select{width:100%;border:1px solid #ddd8d0;border-radius:13px;padding:12px;font-size:14px;background:#fff}.watchform .wide{grid-column:1/-1}.add{grid-column:1/-1;border:0;border-radius:13px;padding:12px;background:var(--green);color:#fff;font-weight:800;font-size:14px}.watchitem{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #eeeae3;padding:12px 0}.watchitem:first-child{margin-top:12px}.watchitem small{display:block;color:var(--muted);margin-top:3px}.remove{border:0;background:var(--soft);border-radius:10px;padding:8px 10px;font-weight:700}.notice{background:#fff8e7;border:1px solid #f1dfad;border-radius:15px;padding:12px;font-size:12px;line-height:1.5;color:#66552e}.more{margin-top:10px;font-size:12px;color:var(--muted)}.more summary{cursor:pointer}.more a{color:#555}.nav{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92%,560px);background:#171717eF;backdrop-filter:blur(12px);border-radius:20px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 10px 35px #0003;z-index:5}.nav a,.nav button{border:0;background:transparent;color:#fff;text-decoration:none;text-align:center;padding:8px 4px;font-size:11px}.nav strong{display:block;font-size:17px;margin-bottom:2px}.version{position:fixed;right:9px;bottom:4px;font-size:9px;color:#9b9891;z-index:6}.source-note{font-size:11px;color:var(--muted);line-height:1.5;margin:14px 3px 0}@media(max-width:430px){.brand h1{font-size:29px}.searchrow button{padding:0 15px}.wrap{padding-left:13px;padding-right:13px}.watchform{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<header class="brand"><div><h1>C•E•GO Price Radar</h1><p>搵價 · 比價 · 記住你幾時要補貨</p></div><span class="beta">BETA</span></header>
<section class="hero" id="searchArea"><div class="searchrow"><input id="q" value="牙刷" placeholder="想買咩？例如：牙刷、鮮奶、Colgate"><button id="search">格價</button></div><div class="quicktitle">快捷搜尋</div><div class="chips"><button class="chip" data-q="鮮奶">🥛 鮮奶</button><button class="chip" data-q="牙膏">🦷 牙膏</button><button class="chip" data-q="牙刷">🪥 牙刷</button><button class="chip" data-q="廁紙">🧻 廁紙</button><button class="chip" data-q="咖啡">☕ 咖啡</button><button class="chip" data-q="零食">🍫 零食</button></div></section>
<section class="section"><div class="sectionhead"><h2>格價結果</h2><span id="resultStatus">未搜尋</span></div><div class="panel" id="results"><div class="empty"><b>輸入貨品，就由我哋去搵。</b>有價格就直接比較；暫時冇資料亦唔會叫你逐間舖自己查。</div></div></section>
<section class="section" id="watchArea"><div class="sectionhead"><h2>❤️ 常買／補貨</h2><span>到期 + 抵買先提醒</span></div><div class="panel"><div class="watchform"><input id="watchName" class="wide" placeholder="例如：維記鮮奶 946ml"><input id="brand" placeholder="品牌（可留空）"><input id="target" type="number" step="0.1" placeholder="目標價（可留空）"><select id="need" class="wide"><option value="7">約 7 日內要補貨</option><option value="14">約 14 日內要補貨</option><option value="30">約 30 日內要補貨</option></select><button class="add" id="watch">加入常買</button></div><div id="watchList"></div></div></section>
<p class="source-note">價格以已接入的公開／官方資料為主。網店價格可能與個別實體分店不同；Price Radar 不會將連鎖店價格假裝成指定分店即時貨架價。</p>
</main>
<nav class="nav"><button onclick="document.getElementById('searchArea').scrollIntoView({behavior:'smooth'})"><strong>⌕</strong>格價</button><button onclick="document.getElementById('watchArea').scrollIntoView({behavior:'smooth'})"><strong>♡</strong>常買</button><a href="nearby.html"><strong>⌖</strong>附近</a></nav><span class="version">v0.6.2</span>
<script>
const DATA_URL='https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json';
const STORES={WELLCOME:'惠康',PARKNSHOP:'百佳',JASONS:'Market Place',MARKETPLACE:'Market Place',WATSONS:'屈臣氏',MANNINGS:'萬寧',AEON:'AEON',DCHFOOD:'大昌食品',SASA:'莎莎',LUNGFUNG:'龍豐'};
const ALIASES={'牙刷':['牙刷','toothbrush','tooth brush'],'牙膏':['牙膏','toothpaste'],'鮮奶':['鮮奶','牛奶','fresh milk','milk'],'牛奶':['牛奶','鮮奶','milk'],'廁紙':['廁紙','衛生紙','toilet paper','toilet tissue'],'咖啡':['咖啡','coffee'],'零食':['零食','snack','snacks','chips','biscuit','chocolate'],'洗頭水':['洗頭水','洗髮水','shampoo'],'衛生巾':['衛生巾','衞生巾','sanitary pad']};
let watchlist=JSON.parse(localStorage.getItem('cego-price-watchlist')||'[]');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),tc=v=>typeof v==='string'?v:(v?.['zh-Hant']||v?.en||v?.['zh-Hans']||''),all=v=>typeof v==='string'?v:[v?.['zh-Hant'],v?.['zh-Hans'],v?.en].filter(Boolean).join(' '),norm=v=>String(v??'').toLowerCase().replace(/[\s\-_/（）()]/g,''),money=n=>Number(n).toFixed(1);
function terms(q){const k=q.trim().toLowerCase();return[...new Set([q,...(ALIASES[k]||[])])].map(norm).filter(Boolean)}
function parse(raw,q){const items=Array.isArray(raw)?raw:(raw.products||raw.items||raw.data||[]),needles=terms(q),rows=[],matched=items.filter(p=>{const h=norm([all(p.brand),all(p.name),all(p.cat1Name),all(p.cat2Name),all(p.cat3Name),p.code].join(' '));return needles.some(n=>h.includes(n))&&Array.isArray(p.prices)&&p.prices.length}).slice(0,160);for(const p of matched){const offers={};for(const o of(p.offers||[]))offers[o.supermarketCode||o.supermarket||o.code]=tc(o);for(const x of(p.prices||[])){const code=x.supermarketCode||x.supermarket||x.code,price=Number(x.price);if(price>0)rows.push({code:p.code||'',brand:tc(p.brand),product:tc(p.name),category:[tc(p.cat1Name),tc(p.cat2Name),tc(p.cat3Name)].filter(Boolean).join(' › '),store:STORES[code]||code,price,promo:offers[code]||''})}}return{products:matched.length,results:rows}}
async function getData(q){try{const r=await fetch('/api/search?q='+encodeURIComponent(q),{cache:'no-store'});if(r.ok){const x=await r.json();if(Array.isArray(x.results)&&x.results.length)return x}}catch{}for(const u of[DATA_URL,'data/pricewatch.json']){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const x=parse(await r.json(),q);if(x.results.length)return x}catch{}}return{results:[]}}
function manualLinks(q){return `<details class="more"><summary>需要自行核對來源？</summary><p><a href="https://online-price-watch.consumer.org.hk/opw/search/${encodeURIComponent(q)}" target="_blank" rel="noopener">開官方格價資訊通</a></p></details>`}
async function search(){const q=$('#q').value.trim();if(!q)return;$('#watchName').value=q;$('#resultStatus').textContent='搜尋中…';$('#results').innerHTML='<div class="loading">正在比較已接入價格…</div>';const x=await getData(q),rows=x.results||[];if(!rows.length){$('#resultStatus').textContent='暫未找到';$('#results').innerHTML=`<div class="empty"><b>暫時未找到「${esc(q)}」價格資料</b>唔代表市面冇貨。你可以遲啲再試，我哋會繼續擴充零售商資料。</div>${manualLinks(q)}`;return}const groups={};for(const r of rows)(groups[r.code||r.product]??=[]).push(r);const list=Object.values(groups).slice(0,25);$('#resultStatus').textContent=`${list.length} 款`;$('#results').innerHTML=`<div class="resultmeta">已按同一貨品比較可用零售商價格</div>`+list.map(g=>{g.sort((a,b)=>a.price-b.price);const a=g[0];return `<div class="deal"><div class="product">${esc(a.brand)} ${esc(a.product)}</div><div class="category">${esc(a.category)}</div>${g.map((r,i)=>`<div class="store"><div><span class="storename">${esc(r.store)}</span>${i===0?'<span class="tag best">較低價</span>':''}${r.promo?`<br><span class="tag promo">${esc(r.promo)}</span>`:''}</div><span class="price">$${money(r.price)}</span></div>`).join('')}</div>`}).join('')+manualLinks(q)}
function saveWatch(){localStorage.setItem('cego-price-watchlist',JSON.stringify(watchlist))}function addWatch(){const name=$('#watchName').value.trim(),brand=$('#brand').value.trim(),target=Number($('#target').value)||null,needDays=Number($('#need').value);if(!name)return;watchlist=watchlist.filter(x=>!(x.name===name&&x.brand===brand));watchlist.unshift({name,brand,target,needDays});saveWatch();renderWatch()}function removeWatch(i){watchlist.splice(i,1);saveWatch();renderWatch()}function renderWatch(){$('#watchList').innerHTML=watchlist.length?watchlist.map((x,i)=>`<div class="watchitem"><div><b>${esc(x.name)}${x.brand?' · '+esc(x.brand):''}</b><small>${x.target?'目標 $'+money(x.target)+' · ':''}${x.needDays} 日內</small></div><button class="remove" onclick="removeWatch(${i})">移除</button></div>`).join(''):'<div class="empty" style="padding-bottom:8px"><b>未有常買貨品</b>加入平時會補貨嘅嘢就得。</div>'}
$('#search').onclick=search;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;search()});$('#watch').onclick=addWatch;renderWatch();
</script></body></html>
