<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C•E•GO Nearby Branch Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ee;color:#171717}.wrap{max-width:960px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e8e2d9;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 8px 28px #0000000d}h1,h2{margin:4px 0 10px}.muted{color:#777;font-size:13px}.chips,.row{display:flex;gap:8px;flex-wrap:wrap}.chip,button{border:0;border-radius:999px;padding:10px 13px;font-weight:800;background:#eee8df;color:#222}.active,.primary{background:#171717;color:#fff}.primary{border-radius:12px}.red{background:#fff0ee;border-color:#ffc9bf}.red h2{color:#b33622}#map{height:48vh;min-height:360px;border-radius:16px;overflow:hidden}.store{border-top:1px dashed #ddd;padding:12px 0}.store:first-child{border-top:0}.rank{font-size:12px;background:#dcf8e8;padding:4px 7px;border-radius:999px}.warn{background:#fff6dc;border:1px solid #f2d990;border-radius:12px;padding:10px;margin-top:10px}.score{font-weight:900;font-size:20px}.nav{display:inline-block;margin-top:7px;text-decoration:none;font-weight:800;color:#2457a7}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tag{font-size:12px;background:#f2eee7;border-radius:999px;padding:5px 8px}@media(max-width:640px){#map{height:45vh;min-height:320px}}
</style>
</head>
<body><div class="wrap">
<h1>📍 C•E•GO 分店 Radar</h1><div class="muted">V0.1 prototype｜附近分店＋距離＋常買優惠命中</div>
<div class="card red"><h2>今日邊間最值得去？</h2><div id="summary" class="muted">先取得你位置，再搵附近分店。</div><div class="chips" style="margin-top:10px"><button class="chip active" data-r="1000">1 km</button><button class="chip" data-r="500">500 m</button><button class="chip" data-r="2000">2 km</button><button class="chip" data-r="5000">5 km</button></div><button class="primary" id="locate" style="margin-top:10px">📍 搵我附近</button></div>
<div class="card"><div id="map"></div><div class="legend"><span class="tag">● 你的位置</span><span class="tag">🛒 超市／個人護理店</span></div></div>
<div class="card"><h2>🏆 附近分店排行</h2><div class="muted">現階段優惠命中採用連鎖店網上價／公開優惠；未證實為指定分店優惠時會清楚標示。</div><div id="stores"><div class="warn">撳「搵我附近」開始。</div></div></div>
<div class="card"><b>資料原則</b><div class="muted" style="margin-top:6px">分店位置先以 OpenStreetMap 附近店舖資料做 prototype；價格／優惠以消委會格價資訊通 Open Data 為主。網上價可能與實體分店不同，因此不會標示成「此分店實價」除非之後有分店級來源。</div><a class="nav" href="https://online-price-watch.consumer.org.hk/opw/branch" target="_blank" rel="noopener">消委會零售地點核對 ↗</a></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA_URL='https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json';
const STORE={WELLCOME:'惠康',PARKNSHOP:'百佳',JASONS:'Market Place',MARKETPLACE:'Market Place',WATSONS:'屈臣氏',MANNINGS:'萬寧',AEON:'AEON',DCHFOOD:'大昌食品',SASA:'莎莎',LUNGFUNG:'龍豐'};
const aliases={wellcome:'惠康','惠康':'惠康','parknshop':'百佳','park n shop':'百佳','百佳':'百佳','market place':'Market Place',watsons:'屈臣氏','屈臣氏':'屈臣氏',mannings:'萬寧','萬寧':'萬寧',aeon:'AEON','aeon':'AEON','sasa':'莎莎','莎莎':'莎莎','lung fung':'龍豐','龍豐':'龍豐','dch food mart':'大昌食品','大昌食品':'大昌食品'};
let radius=1000,map=L.map('map').setView([22.3193,114.1694],11),meLayer,markers=[];
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const watch=()=>JSON.parse(localStorage.getItem('cego-price-watchlist')||'[]');
const tc=v=>typeof v==='string'?v:(v?.['zh-Hant']||v?.en||v?.['zh-Hans']||'');
function dist(a,b,c,d){const R=6371e3,p1=a*Math.PI/180,p2=c*Math.PI/180,dp=(c-a)*Math.PI/180,dl=(d-b)*Math.PI/180,x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function chainOf(tags){const s=[tags.brand,tags.name,tags.operator].filter(Boolean).join(' ').toLowerCase();for(const [k,v] of Object.entries(aliases))if(s.includes(k.toLowerCase()))return v;return tags.name||tags.brand||'店舖'}
async function promoCounts(){const wanted=watch().map(x=>(x.name||'').toLowerCase()).filter(Boolean),counts={};if(!wanted.length)return counts;try{const r=await fetch(DATA_URL,{cache:'no-store'}),raw=await r.json(),items=Array.isArray(raw)?raw:(raw.products||raw.items||raw.data||[]);for(const p of items){const h=[tc(p.brand),tc(p.name),tc(p.cat1Name),tc(p.cat2Name),tc(p.cat3Name)].join(' ').toLowerCase();if(!wanted.some(w=>h.includes(w)))continue;for(const o of(p.offers||[])){const c=STORE[o.supermarketCode||o.supermarket||o.code];if(c)counts[c]=(counts[c]||0)+1}}}catch(e){}return counts}
async function nearby(lat,lon){const q=`[out:json][timeout:20];(nwr(around:${radius},${lat},${lon})[shop=supermarket];nwr(around:${radius},${lat},${lon})[shop=convenience];nwr(around:${radius},${lat},${lon})[shop=chemist];);out center tags;`;const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:q}),j=await r.json();return(j.elements||[]).map(x=>{const la=x.lat||x.center?.lat,lo=x.lon||x.center?.lon,t=x.tags||{};return{lat:la,lon:lo,name:t.name||t.brand||'店舖',chain:chainOf(t),distance:dist(lat,lon,la,lo),tags:t}}).filter(x=>x.lat&&x.lon&&x.distance<=radius)}
function clearMarkers(){markers.forEach(x=>map.removeLayer(x));markers=[]}
async function run(){const btn=document.querySelector('#locate');btn.textContent='定位中…';navigator.geolocation.getCurrentPosition(async p=>{const {latitude:lat,longitude:lon}=p.coords;if(meLayer)map.removeLayer(meLayer);meLayer=L.circleMarker([lat,lon],{radius:9}).addTo(map).bindPopup('你的位置');map.setView([lat,lon],radius<=500?16:radius<=1000?15:radius<=2000?14:13);btn.textContent='📍 更新附近';document.querySelector('#summary').textContent=`搜尋 ${radius>=1000?radius/1000+' km':radius+' m'} 內分店中…`;try{const [shops,promos]=await Promise.all([nearby(lat,lon),promoCounts()]);clearMarkers();shops.forEach(s=>{const m=L.marker([s.lat,s.lon]).addTo(map).bindPopup(`<b>${s.name}</b><br>${Math.round(s.distance)} m<br>${promos[s.chain]||0} 個常買優惠命中*`);markers.push(m)});const ranked=shops.map(s=>({...s,hits:promos[s.chain]||0,score:(promos[s.chain]||0)*100-Math.min(s.distance,5000)/50})).sort((a,b)=>b.score-a.score||a.distance-b.distance);document.querySelector('#summary').innerHTML=ranked.length?`附近找到 <b>${ranked.length}</b> 間店。${ranked[0].hits?`目前以 <b>${ranked[0].name}</b> 最值得先睇：常買優惠命中 ${ranked[0].hits} 項*。`:'未有常買優惠命中，暫時按距離排序。'}`:'呢個半徑暫未由地圖資料搵到店舖。';document.querySelector('#stores').innerHTML=ranked.length?ranked.slice(0,20).map((s,i)=>`<div class="store"><span class="rank">#${i+1}</span> <b>${s.name}</b><div class="muted">${s.chain!==s.name?s.chain+'｜':''}${Math.round(s.distance)} m</div><div><span class="score">${s.hits}</span> <span class="muted">個常買優惠命中*</span></div><a class="nav" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}">導航 ↗</a></div>`).join(''):'<div class="warn">未找到店舖，可試 2 km / 5 km。</div>'; }catch(e){document.querySelector('#stores').innerHTML='<div class="warn">附近店舖資料暫時讀取失敗，稍後再試。</div>';document.querySelector('#summary').textContent='地圖已定位，但店舖資料暫時未載入。'}},()=>{btn.textContent='📍 搵我附近';document.querySelector('#summary').textContent='需要允許位置權限先可以計附近分店。'},{enableHighAccuracy:true,timeout:12000});}
document.querySelector('#locate').onclick=run;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('active'));b.classList.add('active');radius=Number(b.dataset.r);run()});
</script></body></html>
