<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>C•E•GO Nearby Branch Radar v0.7.0</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;margin:0;background:#f7f4ee;color:#171717}.wrap{max-width:720px;margin:auto;padding:18px 18px 112px}.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.back{width:42px;height:42px;border:1px solid #ddd6cc;background:#fff;border-radius:14px;display:grid;place-items:center;color:#171717;text-decoration:none;font-size:23px;font-weight:900}.title{font-size:25px;font-weight:900}.muted{color:#707070;font-size:13px;line-height:1.5}.card{background:#fff;border:1px solid #e8e2d9;border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 8px 28px #0000000d}h2{margin:2px 0 10px;font-size:20px}.row{display:flex;gap:8px;flex-wrap:wrap}.chip,button,a.btn{padding:11px 13px;border-radius:12px;border:1px solid #ddd;background:#fff;color:#171717;font-weight:800;text-decoration:none}.primary{background:#171717!important;color:#fff!important;border-color:#171717!important}.active{background:#fff0ee!important;border-color:#e65a2f!important;color:#b33622!important}.store{border-top:1px dashed #ddd;padding:14px 0}.store:first-child{border-top:0}.rank{font-size:12px;background:#dcf8e8;border-radius:999px;padding:4px 8px;font-weight:800}.tag{display:inline-block;background:#f2eee7;border-radius:999px;padding:5px 8px;font-size:12px;margin:5px 5px 0 0}.metric{font-size:24px;font-weight:900}.bottom{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(calc(100% - 28px),690px);display:grid;grid-template-columns:repeat(3,1fr);background:#171717;border-radius:20px;padding:7px;box-shadow:0 12px 35px #0003}.bottom a{color:#bbb;text-decoration:none;text-align:center;padding:9px 4px;font-size:11px;border-radius:14px}.bottom .active{background:#fff;color:#171717;font-weight:850}.version{position:fixed;right:10px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 74px);font-size:10px;color:#aaa;background:#f7f4eedd;padding:4px 6px;border-radius:8px}@media(max-width:420px){.wrap{padding-left:14px;padding-right:14px}.title{font-size:22px}.row>*{flex:1 1 auto}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html" aria-label="返回 Price Radar">‹</a><div><div class="muted">C•E•GO Price Radar</div><div class="title">📍 附近分店</div></div></div><div class="card"><h2>你附近</h2><div class="muted">用手機位置搜尋附近超市、藥妝及便利店。實體店公開優惠會由 Price Radar 搜尋；未有指定分店證據時，不會當成該分店一定同價。</div><div class="row" style="margin-top:13px"><button id="locate" class="primary">📍 使用目前位置</button><button class="chip radius active" data-r="1000">1 km</button><button class="chip radius" data-r="500">500 m</button><button class="chip radius" data-r="2000">2 km</button><button class="chip radius" data-r="5000">5 km</button></div><div id="locationStatus" class="muted" style="margin-top:10px">未取得位置。位置只用於今次附近搜尋。</div></div><div class="card"><h2>❤️ 常買清單</h2><div id="watchSummary" class="muted">讀取中…</div></div><div class="card"><h2>🏆 今日較值得去</h2><div class="muted">先用常買貨品公開格價＋優惠命中排序；下一層再加入指定分店優惠證據。</div><div id="ranking" style="margin-top:12px">準備分析…</div></div></main><nav class="bottom"><a href="index.html#resultsSection">⌕<br>格價</a><a href="index.html#watchSection">♡<br>常買</a><a class="active" href="nearby.html">⌖<br>附近</a></nav><div class="version">v0.7.0</div><script>const STORE={WELLCOME:'惠康',PARKNSHOP:'百佳',JASONS:'Market Place',MARKETPLACE:'Market Place',WATSONS:'屈臣氏',MANNINGS:'萬寧',AEON:'AEON',DCHFOOD:'大昌食品',SASA:'莎莎',LUNGFUNG:'龍豐'};const QUERY={'惠康':'Wellcome supermarket','百佳':'PARKnSHOP','Market Place':'Market Place supermarket','屈臣氏':'Watsons','萬寧':'Mannings','AEON':'AEON supermarket','大昌食品':'DCH Food Mart','莎莎':'Sa Sa','龍豐':'Lung Fung','7-Eleven':'7-Eleven','OK便利店':'Circle K'};const ALIASES={'牙刷':['牙刷','toothbrush'],'牙膏':['牙膏','toothpaste'],'廁紙':['廁紙','toilet paper'],'牛奶':['牛奶','鮮奶','milk'],'鮮奶':['鮮奶','牛奶','milk'],'零食':['零食','snack','chips','餅乾','biscuit','朱古力','chocolate'],'咖啡':['咖啡','coffee']};let pos=null,radius=1000,feed=null;const $=s=>document.querySelector(s),tc=v=>typeof v==='string'?v:(v?.['zh-Hant']||v?.en||v?.['zh-Hans']||''),all=v=>typeof v==='string'?v:[v?.['zh-Hant'],v?.['zh-Hans'],v?.en].filter(Boolean).join(' '),norm=v=>String(v??'').toLowerCase().replace(/[\s\-_/（）()]/g,''),terms=q=>[...new Set([q,...(ALIASES[String(q).trim().toLowerCase()]||[])])].map(norm).filter(Boolean),hay=p=>norm([all(p.brand),all(p.name),all(p.cat1Name),all(p.cat2Name),all(p.cat3Name),p.code].join(' '));function watchlist(){try{return JSON.parse(localStorage.getItem('cego-price-watchlist')||'[]')}catch{return[]}}function offerFor(p,code){const o=(p.offers||[]).find(x=>(x.supermarketCode||x.supermarket||x.code)===code);return o?tc(o):''}async function loadFeed(){if(feed)return feed;for(const u of['data/pricewatch.json','https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json'])try{const r=await fetch(u,{cache:'no-store'});if(r.ok){const x=await r.json();feed=Array.isArray(x)?x:(x.products||x.items||x.data||[]);if(feed.length)return feed}}catch(e){}return[]}async function analyse(){const wl=watchlist();$('#watchSummary').innerHTML=wl.length?wl.map(x=>`<span class="tag">${x.name}</span>`).join(''):'未有常買貨品。返去「常買」加入後，呢度會自動讀取。';const items=await loadFeed(),stat={};for(const n of Object.values(STORE))stat[n]={name:n,hits:0,promos:0,products:[],sum:0};for(const w of wl){const needles=terms(w.name),matches=items.filter(p=>needles.some(n=>hay(p).includes(n)));for(const p of matches)for(const x of(p.prices||[])){const code=x.supermarketCode||x.supermarket||x.code,name=STORE[code],price=Number(x.price);if(!name||!stat[name]||!Number.isFinite(price)||price<=0)continue;stat[name].hits++;stat[name].sum+=price;const promo=offerFor(p,code);if(promo)stat[name].promos++;if(stat[name].products.length<3)stat[name].products.push(`${tc(p.brand)} ${tc(p.name)}`.trim())}}render(Object.values(stat).sort((a,b)=>(b.promos*3+b.hits)-(a.promos*3+a.hits)||a.sum-b.sum),wl.length)}function mapUrl(name){const q=QUERY[name]||name;return pos?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q+' near '+pos.lat+','+pos.lng)}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`}function render(list,count){$('#ranking').innerHTML=list.map((s,i)=>`<div class="store"><div style="display:flex;justify-content:space-between;gap:10px"><div><span class="rank">#${i+1}</span> <b>${s.name}</b></div><div class="metric">${s.promos}</div></div><div class="muted">格價命中 ${s.hits}｜優惠 ${s.promos}${count?'｜'+count+' 個常買項目':''}</div>${s.products.length?`<div>${s.products.map(x=>`<span class="tag">${x}</span>`).join('')}</div>`:''}<div class="row" style="margin-top:9px"><a class="btn primary" href="${mapUrl(s.name)}" target="_blank" rel="noopener">📍 附近${s.name}</a></div></div>`).join('')}function locate(){const el=$('#locationStatus');if(!navigator.geolocation){el.textContent='此瀏覽器未支援定位。';return}el.textContent='定位中…';navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};el.textContent=`已取得位置｜搜尋半徑 ${radius>=1000?radius/1000+' km':radius+' m'}`;analyse()},e=>{el.textContent='未能取得位置：'+e.message},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}$('#locate').onclick=locate;document.querySelectorAll('.radius').forEach(b=>b.onclick=()=>{document.querySelectorAll('.radius').forEach(x=>x.classList.remove('active'));b.classList.add('active');radius=Number(b.dataset.r)});analyse();</script></body></html>
