name: Update Consumer Council Price Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-pricewatch.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official daily JSON
        run: |
          mkdir -p data
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json' \
            -o data/pricewatch.json
          python - <<'PY'
          import json
          p='data/pricewatch.json'
          with open(p,'r',encoding='utf-8-sig') as f: data=json.load(f)
          if not data: raise SystemExit('Empty price feed')
          print('Official feed downloaded successfully')
          PY
      - name: Commit refreshed feed
        run: |
          git config user.name 'cego-price-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/pricewatch.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh Consumer Council price feed'
          git push
