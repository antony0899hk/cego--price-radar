name: Update Consumer Council Price Data
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-pricewatch.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download official daily JSON
        run: |
          mkdir -p data
          cp data/pricewatch.json /tmp/pricewatch-before.json 2>/dev/null || true
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json' \
            -o /tmp/pricewatch-new.json
          python - <<'PY'
          import json
          with open('/tmp/pricewatch-new.json','r',encoding='utf-8-sig') as f: data=json.load(f)
          if not data: raise SystemExit('Empty price data')
          print('Official price data downloaded successfully')
          PY
      - name: Detect CEGO first-seen products
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone, timedelta
          hk=timezone(timedelta(hours=8)); now=datetime.now(hk)
          anchors={'WELLCOME':'惠康','PARKNSHOP':'百佳','MANNINGS':'萬寧','WATSONS':'屈臣氏'}
          def rows(x):
              if isinstance(x,list): return x
              return x.get('products') or x.get('data') or []
          def txt(v):
              if isinstance(v,dict): return v.get('zh-Hant') or v.get('en') or next(iter(v.values()),'')
              return v or ''
          def load_text(s):
              try:return json.loads(s.lstrip('\ufeff'))
              except:return []
          def anchor_item(x,day):
              stores=[]; prices=[]
              for p in x.get('prices') or []:
                  sc=p.get('supermarketCode')
                  if sc in anchors:
                      stores.append(anchors[sc])
                      try: prices.append({'store':anchors[sc],'price':float(p.get('price'))})
                      except: pass
              if not stores:return None
              return {'code':str(x.get('code','')),'brand':txt(x.get('brand')),'product':txt(x.get('name')),
                'category':txt(x.get('cat2Name') or x.get('cat1Name') or x.get('cat3Name')),
                'stores':list(dict.fromkeys(stores)),'prices':prices,'firstSeenAt':day,
                'label':'CEGO 首次發現','officialNew':False}
          # Rebuild a rolling first-seen history from committed daily snapshots.
          shas=subprocess.check_output(['git','log','--reverse','--since=35.days','--format=%H','--','data/pricewatch.json'],text=True).split()
          snaps=[]
          for sha in shas:
              try:
                  raw=subprocess.check_output(['git','show',f'{sha}:data/pricewatch.json'],text=True)
                  day=subprocess.check_output(['git','show','-s','--format=%cI',sha],text=True).strip()[:10]
                  snaps.append((day,rows(load_text(raw))))
              except: pass
          with open('/tmp/pricewatch-new.json','r',encoding='utf-8-sig') as f: current=rows(json.load(f))
          snaps.append((now.date().isoformat(),current))
          seen=set(); found={}
          for i,(day,items) in enumerate(snaps):
              codes={str(x.get('code','')) for x in items if x.get('code')}
              if i==0:
                  seen|=codes
                  continue
              for x in items:
                  code=str(x.get('code',''))
                  if not code or code in seen or code in found: continue
                  item=anchor_item(x,day)
                  if item: found[code]=item
              seen|=codes
          cutoff=(now.date()-timedelta(days=30)).isoformat()
          kept=[x for x in found.values() if x.get('firstSeenAt','')>=cutoff]
          kept.sort(key=lambda x:(x.get('firstSeenAt',''),x.get('code','')),reverse=True)
          today=now.date().isoformat()
          out={'version':'0.10.4','updatedAt':now.isoformat(),'results':kept[:160],
               'newToday':sum(1 for x in kept if x.get('firstSeenAt')==today),
               'historySnapshots':len(snaps),
               'note':'CEGO first-seen compares daily Consumer Council product codes. It is not a manufacturer launch date.'}
          with open('data/new-arrivals.json','w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          print('Snapshots:',len(snaps),'First-seen products:',len(kept),'Today:',out['newToday'])
          PY
          mv /tmp/pricewatch-new.json data/pricewatch.json
      - name: Commit refreshed price data and first-seen Radar
        run: |
          git config user.name 'cego-price-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/pricewatch.json data/new-arrivals.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh prices and new-arrival radar'
          git pull --rebase origin main
          git push
