<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEGO Price Search Lab</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f4ee;margin:0;color:#171717}.wrap{max-width:850px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e8e2d9;border-radius:18px;padding:16px;margin:12px 0}input,select,button{padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}input{width:100%;box-sizing:border-box}button{background:#171717;color:#fff;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.item{padding:12px 0;border-top:1px dashed #ddd}.muted{color:#777;font-size:13px}.price{font-size:22px;font-weight:900}</style></head><body><div class="wrap"><h1>Price Radar Search Lab</h1><div class="card"><div id="meta" class="muted">初始化資料庫…</div><input id="q" placeholder="試：牙膏、Colgate、惠康、咖啡"><div class="row" style="margin-top:10px"><select id="store"><option value="">全部店舖</option><option>惠康</option><option>百佳</option><option>萬寧</option><option>屈臣氏</option></select><label><input id="promo" type="checkbox"> 只睇減價</label><button id="go">搜尋</button><button id="reload">重建資料庫</button></div></div><div class="card"><b id="count">0 個結果</b><div id="results"></div></div></div><script src="src/data-store.js"></script><script src="src/search-engine.js"></script><script>let items=[];async function importData(){const raw=await fetch('data/products.json').then(r=>r.json());items=Object.entries(raw).flatMap(([category,list])=>list.map((x,i)=>({id:`${category}-${x.store}-${i}-${x.product}`,category,...x})));await CEGOStore.replaceAll(items,{source:'data/products.json'});await refresh();}async function refresh(){items=await CEGOStore.all();const m=await CEGOStore.meta();meta.textContent=`IndexedDB：${m?.count||0} 筆｜更新 ${m?.updatedAt?new Date(m.updatedAt).toLocaleString():'—'}`;run()}function run(){const list=CEGOSearch.search(items,q.value,{store:store.value||undefined,promoOnly:promo.checked});count.textContent=list.length+' 個結果';results.innerHTML=list.slice(0,50).map(x=>`<div class="item"><b>${x.store}｜${x.product}</b><div class="price">HK$${Number(x.price).toFixed(1)}</div><div class="muted">${x.brand}｜${x.category}｜${x.promo}｜saving ${Number(x.saving||0).toFixed(1)}｜score ${x._score}</div></div>`).join('')||'<div class="muted">冇結果</div>'}go.onclick=run;q.oninput=run;store.onchange=run;promo.onchange=run;reload.onclick=importData;(async()=>{items=await CEGOStore.all();if(!items.length)await importData();else await refresh()})();</script></body></html>
